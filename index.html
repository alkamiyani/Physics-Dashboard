 (d) both (b) and (c)", "answer": "(a)"}, {"id": "MC3", "topic": "Conceptual Review", "text": "The slope of a position–time graph gives the (a) acceleration (b) velocity (c) displacement (d) distance", "answer": "(b)"}, {"id": "MC4", "topic": "Conceptual Review", "text": "The area between a velocity–time graph and the time axis gives the (a) acceleration (b) displacement (c) average speed (d) instantaneous velocity", "answer": "(b)"}, {"id": "MC5", "topic": "Conceptual Review", "text": "At the top of its trajectory, a projectile launched at an angle has (a) zero speed (b) zero acceleration (c) zero vertical velocity but non-zero horizontal velocity (d) zero horizontal velocity but non-zero vertical velocity", "answer": "(c)"}]}, {"num": 3, "title": "Newton's Laws of Motion", "short": "Newton's Laws", "objectives": ["State Newton's three laws of motion and explain the concepts of force, inertia, and mass.", "Apply ΣF⃗ = ma⃗ to find the acceleration of an object acted on by several forces, using the vector methods of Chapter 1.", "Identify action–reaction pairs and distinguish them from balanced forces acting on a single body.", "Draw a free-body diagram for any object and use it to write Newton's second law in component form.", "Describe static and kinetic friction, use the coefficients μs and μk, and solve problems in which friction acts.", "Solve equilibrium problems (hanging masses, blocks held on inclines) and dynamics problems on inclined planes.", "Analyze connected systems — Atwood machines and blocks joined over pulleys — for their common acceleration and the tension in the string."], "sections": [{"num": "3.1", "title": "Introduction: Force and Motion", "paragraphs": ["Chapter 2 described how objects move; this chapter explains why. The link between motion and its causes is provided by Newton's three laws of motion, published by Isaac Newton in 1687 and still the foundation of engineering mechanics today. The central concept is force — a push or a pull that one object exerts on another. Some forces act through direct contact (a hand pushing a crate, the tension in a rope, friction, the support of a floor), while the fundamental forces of nature act at a distance: the gravitational force that pulls an apple toward the Earth, the electric force between charges, and the magnetic force between magnets or moving charges. Force is a vector quantity: its direction matters as much as its size, and when several forces act on one object it is their vector sum — the net force ΣF⃗ — that determines the motion. The SI unit of force is the newton (N), defined so that a net force of 1 N gives a 1 kg mass an acceleration of 1 m/s²: 1 N = 1 kg·m/s²"]}, {"num": "3.2", "title": "Newton's First Law: Inertia", "paragraphs": ["Newton's First Law An object continues in a state of rest, or of motion at constant velocity in a straight line, unless it is compelled to change that state by a net force acting on it.", "Two points in this statement deserve emphasis. First, it treats rest and uniform straight-line motion identically: neither requires a force to maintain it. A crate sitting on the floor and a crate sliding across frictionless ice at constant velocity are both in the same situation — zero net force. Second, the word net is essential. Many forces may act on the crate on the floor (its weight downward, the floor's support upward), but as long as they add to zero the crate's velocity does not change. The first law is often called the law of inertia. Inertia is the natural tendency of an object to remain at rest or in motion at constant velocity, and mass is the quantitative measure of inertia: a greater net force is needed to change the velocity of a more massive object by the same amount. The SI unit of mass is the kilogram. Mass must not be confused with weight, which is the gravitational force on an object and is measured in newtons; a 2 kg mass has the same inertia on the Earth, on the Moon, or in deep space, but very different weights in each place. Everyday experience in a car illustrates inertia directly. When the car stops suddenly, your body continues forward at its previous velocity until the seat belt supplies the force needed to stop it; when the car accelerates rapidly, the seat must push your body forward to make it keep up, which you feel as being pressed back into the seat. Both effects are explained by the first law: your body tends to keep whatever velocity it already has."]}, {"num": "3.3", "title": "Newton's Second Law", "paragraphs": ["Newton's Second Law When a net external force ΣF⃗ acts on an object of mass m, the object accelerates. The acceleration is directly proportional to the net force, inversely proportional to the mass, and in the same direction as the net force: ΣF⃗ = m a⃗ or a⃗ = ΣF⃗/m", "The second law is a vector equation, so it holds separately for each component: ΣFx = m ax and ΣFy = m ay. In practice this is how it is nearly always used — all the forces on the object are resolved into components along a convenient pair of axes, and the two component equations are solved. The first law is contained in the second as the special case ΣF⃗ = 0, which gives a⃗ = 0: constant velocity. A graph of the magnitude of the net force against the resulting acceleration for a given object is a straight line through the origin; its slope is the mass. This is the operational meaning of the statement that mass measures inertia."]}, {"num": "3.4", "title": "Newton's Third Law: Action and Reaction", "paragraphs": ["Newton's Third Law Whenever one body exerts a force on a second body, the second body exerts a force of equal magnitude and opposite direction on the first.", "Forces always come in pairs. When a rocket engine pushes exhaust gas downward, the gas pushes the rocket upward with an equal force — the thrust; when you push on a wall, the wall pushes back on your hands. The two forces of an action–reaction pair always act on different bodies, which is why they never cancel each other: the force on the rocket accelerates the rocket, while the force on the gas accelerates the gas. This is the most common point of confusion with the third law, and the box below addresses it directly. An important example is the normal force. A book resting on a table presses down on the table; the table presses up on the book with a force perpendicular (“normal”) to the surface, written n⃗ or F⃗ₙ. Because the book is in equilibrium, the normal force on it equals its weight in magnitude — but the weight and the normal force are not an action–reaction pair (both act on the book). The reaction to the book's weight is the gravitational pull the book exerts on the Earth; the reaction to the normal force is the downward push of the book on the table.", "Common student error — “action and reaction cancel, so nothing can move” Balanced forces cancel only when they act on the same object. The forces in a third-law pair act on two different objects, so each object feels only one of them. A horse can pull a cart forward because the force of the horse on the cart and the force of the cart on the horse act on different bodies; what actually accelerates the horse–cart system is the friction force of the ground on the horse's hooves — and that too is the reaction to the horse pushing backward on the ground. Rubber-soled shoes work for the same reason: rubber has a high coefficient of friction with the floor, so the floor can push back hard enough to accelerate you."]}, {"num": "3.5", "title": "Friction", "paragraphs": ["3.5.1 Static and Kinetic Friction When two surfaces are in contact, microscopic irregularities interlock and bond at the relatively few points where the surfaces actually touch. The result is a friction force that acts parallel to the surfaces and opposes the tendency of one surface to slide across the other. Two regimes must be distinguished. Static friction acts when there is no sliding. It adjusts itself to exactly balance whatever force is trying to start the motion, up to a maximum value. If the applied force exceeds that maximum, the surfaces break free and begin to slide. The maximum static friction force is proportional to the normal force pressing the surfaces together: fs ≤ fs,max = μs n Kinetic friction acts once sliding has begun. It has an approximately constant magnitude, again proportional to the normal force, and is directed opposite to the velocity of the sliding surface: fk = μk n The coefficients μs (static) and μk (kinetic) depend on the two materials in contact but not, to a good approximation, on the contact area or on the sliding speed. Because each is the ratio of two forces, the coefficient of friction is a pure number with no unit. For nearly every pair of materials μ k is smaller than μs —", "it takes more force to start an object sliding than to keep it sliding — which is why a stuck drawer suddenly lurches open. Figure 3.2 summarizes the behaviour, and Table 3.1 lists typical values.", "Surfaces μs μk", "Rubber on dry concrete 1.0 0.8", "Steel on steel (dry) 0.74 0.57", "Aluminium on steel 0.61 0.47", "Wood on wood 0.25–0.5 0.2", "Waxed wood on wet snow 0.14 0.1", "Ice on ice 0.1 0.03", "Teflon on Teflon 0.04 0.04", "Synovial joints in humans 0.01 0.003", "Table 3.1 Approximate coefficients of friction (after Serway & Jewett, 2019).", "3.5.2 Free-Body Diagrams Almost every problem in this chapter is solved the same way: isolate one object, draw every force acting on it as an arrow from a single point, choose axes, and apply ΣFx = max and ΣFy = may. The sketch of the forces is called a free-body diagram. Figure 3.1 shows the procedure for a block pulled along a rough floor by a rope inclined at angle θ. Note that only forces on the block appear — not forces the block exerts on other things — and that the pull is resolved into horizontal and vertical components.", "A subtle but important consequence of an inclined pull is that it changes the normal force. In Figure 3.1 the vertical equation reads n + F sinθ − mg = 0, so n = mg − F sinθ: the upward component of the pull partly supports the block, reducing the normal force and therefore the friction. A push directed downward at an angle has the opposite effect."]}, {"num": "3.6", "title": "Equilibrium of a Particle", "paragraphs": ["An object is in equilibrium when the net force on it is zero, so that (by the first law) it remains at rest or moves at constant velocity. In components: ΣFx = 0 and ΣFy = 0 Equilibrium problems are the simplest applications of Newton's laws, but they exercise every skill needed for the harder problems that follow: drawing a correct free-body diagram, choosing axes, and resolving forces into components. A classic case is a mass hung from two strings (Figure 3.5); the knot where the strings meet is the “particle” in equilibrium."]}, {"num": "3.7", "title": "Motion on an Inclined Plane", "paragraphs": ["For a block on a slope, the natural choice of axes is x parallel to the incline (positive down the slope, say) and y perpendicular to it (Figure 3.3). The weight mg⃗ is then the only force that needs resolving: its component along the slope is mg sinθ and its component into the slope is mg cosθ, where θ is the angle of the incline. The normal force is perpendicular to the surface, and any friction acts along the surface.", "Because there is no acceleration perpendicular to the surface, the y-equation always gives the normal force directly: with no other forces perpendicular to the slope, n = mg cosθ. The x-equation then contains the physics of the particular problem."]}, {"num": "3.8", "title": "Connected Objects and Pulleys", "paragraphs": ["When two objects are joined by a string passing over a light, frictionless pulley, two facts simplify the analysis enormously: the string has the same tension T throughout, and — because the string does not stretch — both objects have the same magnitude of acceleration a. The method is to draw a separate free- body diagram for each object, write Newton's second law for each along its own direction of motion (taking the actual direction of motion as positive for both), and solve the two equations simultaneously. Adding the equations eliminates T and gives a; substituting back gives T. Figure 3.4 shows the two standard configurations."]}], "examples": [{"id": "3.1", "title": "Acceleration, distance, and speed from a known force", "section": "3.3", "problem": "A car of mass 800 kg is driven by a motor force of 112 × 10³ N. Find the distance it moves and its speed 5.0 s after starting from rest (treating the motor force as the net force).", "solution": ""}, {"id": "3.2", "title": "Two forces on a rolling ball", "section": "3.3", "problem": "A ball of mass 0.30 kg rolls on a horizontal surface under two forces: F⃗₁ = 5.0 N directed 20° below the +x-axis, and F⃗₂ = 8.0 N directed 60° above the +x-axis. Find the magnitude and direction of the acceleration.", "solution": ""}, {"id": "3.3", "title": "Weight is not mass", "section": "3.3", "problem": "A man pulls a box that weighs 300 N with a horizontal force of 20 N along a frictionless floor. Find the acceleration and the distance moved in 2.0 s.", "solution": ""}, {"id": "3.4", "title": "The force on a bullet", "section": "3.3", "problem": "A 5.0 g bullet leaves the 0.82 m barrel of a rifle at 320 m/s. Find the average force on the bullet while it is in the barrel.", "solution": ""}, {"id": "3.5", "title": "The force needed to start a block moving", "section": "3.5", "problem": "A 30 kg block rests on a horizontal floor with μs = 0.20. A rope pulls it at 20° above the horizontal. Draw the free-body diagram and find the tension that just starts the block moving.", "solution": ""}, {"id": "3.6", "title": "Measuring μs with two blocks", "section": "3.5", "problem": "A 6.0 kg block on a horizontal table is connected by a string over a frictionless pulley to a 2.0 kg block hanging over the edge. The system is just on the verge of moving. Draw the force diagrams and find the coefficient of static friction between the table and the 6.0 kg block.", "solution": ""}, {"id": "3.7", "title": "Tension in two strings", "section": "3.6", "problem": "A mass M = 1.5 kg hangs from a knot supported by two strings: string 1 runs horizontally to a wall, and string 2 runs to the ceiling making an angle θ = 30° with the ceiling (Figure 3.5). Find the tension T₁ in string 1.", "solution": ""}, {"id": "3.8", "title": "Sliding down a smooth incline", "section": "3.7", "problem": "A body starts from rest at the top of a smooth (frictionless) incline of length 2.0 m inclined at 15°. Find (1) its acceleration and (2) its speed at the bottom.", "solution": ""}, {"id": "3.9", "title": "Derivation: acceleration down a rough incline", "section": "3.7", "problem": "Show that a block sliding down an incline of angle θ with coefficient of kinetic friction μ k has acceleration a = g(sinθ − μk cosθ).", "solution": ""}, {"id": "3.10", "title": "Holding a block on a rough incline", "section": "3.7", "problem": "A 10 kg block rests on an incline of 30° with μs = 0.20. A force F⃗ parallel to the slope holds it in equilibrium on the verge of sliding down. (1) Draw the force diagram. (2) Find the normal force. (3) Find F.", "solution": ""}, {"id": "3.11", "title": "Pressing a block against an incline", "section": "3.7", "problem": "The coefficient of static friction between a 3.00 kg block and a 35.0° incline is 0.300. What minimum force F⃗, applied perpendicular to the incline surface, will prevent the block from sliding down?", "solution": ""}, {"id": "3.12", "title": "The Atwood machine", "section": "3.8", "problem": "Masses of 3.0 kg and 5.0 kg hang from the ends of a string over a frictionless pulley (Figure 3.4a). Find the acceleration of the system and the tension in the string.", "solution": ""}, {"id": "3.13", "title": "Two blocks on a symmetric double incline", "section": "3.8", "problem": "Blocks of 3.50 kg and 8.00 kg rest on opposite faces of a smooth double incline, each face at 35.0°, connected by a string over a pulley at the apex (Figure 3.4b with θ₁ = θ₂ = 35.0°). Find (1) the acceleration and (2) the tension.", "solution": ""}, {"id": "3.14", "title": "Blocks on faces of different slope", "section": "3.8", "problem": "A block M = 8.0 kg on a smooth 30° face is connected over a pulley to a block m = 15 kg on a smooth 60° face of the same double incline. Find (1) the acceleration and (2) the tension.", "solution": ""}, {"id": "3.15", "title": "Derivation: hanging mass needed to move a block up a rough incline", "section": "3.8", "problem": "A block of mass M rests on an incline of angle θ with coefficient of static friction μ s, and is connected by a string over a pulley at the top of the incline to a hanging mass m. Show that the block is on the verge of moving up the incline when m = M(sinθ + μs cosθ).", "solution": ""}], "summary": ["First law: an object keeps its velocity (zero or otherwise) unless a net force acts. Inertia is the tendency to do so; mass (kg) measures it. Weight W = mg is a force (N), not a mass.", "Second law: ΣF⃗ = ma⃗ , applied by components: ΣFx = max, ΣFy = may. The acceleration is in the direction of the net force.", "Third law: forces occur in equal-and-opposite pairs acting on different bodies. Action–reaction pairs never cancel; the weight of an object and the normal force on it are not such a pair.", "Friction: fs ≤ μs n (static, adjusts to prevent sliding); fk = μk n (kinetic, constant while sliding); μk < μs. The normal force is found from the perpendicular equation and is changed by any inclined applied force.", "Procedure: isolate the object, draw its free-body diagram, choose axes (parallel and perpendicular to any incline), resolve forces, apply the second law along each axis. Equilibrium means Σ F⃗ = 0.", "Incline: n = mg cosθ; along the slope the weight contributes mg sinθ. Frictionless: a = g sinθ. Rough: a = g(sinθ − μk cosθ). A block begins to slip when tanθ = μs.", "Connected objects share one tension and one acceleration magnitude. Write the second law for each body in its direction of motion, add to find a, substitute back for T. Atwood machine: a = (m₂ − m₁)g/(m₁ + m₂)."], "problems": [{"id": "A1", "topic": "Newton's First and Second Laws", "text": "A net force of 3000 N acts on a 1200 kg car. Find its acceleration.", "answer": "2.50 m/s²"}, {"id": "A2", "topic": "Newton's First and Second Laws", "text": "Two forces act on a 2.0 kg object: 6.0 N toward the east and 8.0 N toward the north. Find the magnitude and direction of the net force and of the acceleration.", "answer": "10.0 N at 53.1° north of east; a = 5.00 m/s² in the same direction"}, {"id": "A3", "topic": "Newton's First and Second Laws", "text": "A person has a mass of 70.0 kg. Find the person's weight (a) on Earth and (b) on the Moon, where g = 1.62 m/s². Does the person's mass change?", "answer": "(a) 686 N (b) 113 N; the mass is 70.0 kg in both places"}, {"id": "A4", "topic": "Newton's First and Second Laws", "text": "A 60.0 kg passenger stands on a scale in an elevator. What does the scale read (in newtons) when the elevator accelerates (a) upward at 2.00 m/s² and (b) downward at 2.00 m/s²? (The scale reads the normal force.)", "answer": "(a) 708 N (b) 468 N"}, {"id": "A5", "topic": "Newton's First and Second Laws", "text": "A 10.0 g bullet is accelerated from rest to 400 m/s along a 0.600 m barrel. Find the average force on the bullet.", "answer": "1.33 × 10³ N"}, {"id": "A6", "topic": "Newton's First and Second Laws", "text": "Explain, using Newton's first law, why a passenger lurches forward when a bus brakes suddenly, even though no force pushes the passenger forward.", "answer": ""}, {"id": "B1", "topic": "Friction", "text": "A 20.0 kg crate rests on a floor with μs = 0.40 and μk = 0.30. Find (a) the minimum horizontal force needed to start it moving, (b) the friction force once it is sliding, and (c) its acceleration if pushed horizontally with 100 N.", "answer": "(a) 78.4 N (b) 58.8 N (c) 2.06 m/s²"}, {"id": "B2", "topic": "Friction", "text": "A 15.0 kg crate is pulled along a floor (μk = 0.25) by a rope at 30° above the horizontal with tension 60.0 N. Draw the free-body diagram and find the acceleration.", "answer": "n = 117 N; a = 1.51 m/s²"}, {"id": "B3", "topic": "Friction", "text": "A 0.160 kg hockey puck sliding at 12.0 m/s comes to rest after 40.0 m. Find the coefficient of kinetic friction between puck and ice.", "answer": "0.184"}, {"id": "B4", "topic": "Friction", "text": "Explain why the coefficient of friction has no units, and why μk is normally less than μs.", "answer": ""}, {"id": "C1", "topic": "Equilibrium", "text": "A 5.00 kg lamp hangs from the ceiling by two cords, each making 40.0° with the horizontal. Find the tension in each cord.", "answer": "38.1 N in each cord"}, {"id": "C2", "topic": "Equilibrium", "text": "An 8.00 kg sign hangs from a knot supported by a horizontal cable to a wall and a second cable to the ceiling at 50.0° above the horizontal. Find the tension in each cable.", "answer": "ceiling cable 102 N; horizontal cable 65.8 N"}, {"id": "C3", "topic": "Equilibrium", "text": "In Example 3.7, what happens to T₁ and T₂ as the angle θ of string 2 is made smaller and smaller? Explain physically.", "answer": ""}, {"id": "D1", "topic": "Inclined Planes", "text": "A block slides from rest down a frictionless 25.0° incline. Find its acceleration and its speed after sliding 3.00 m.", "answer": "4.14 m/s²; 4.98 m/s"}, {"id": "D2", "topic": "Inclined Planes", "text": "A 4.00 kg block slides down a 30.0° incline with μk = 0.20. Find its acceleration.", "answer": "3.20 m/s²"}, {"id": "D3", "topic": "Inclined Planes", "text": "A block rests on a board. The board is slowly tilted, and the block begins to slip when the angle reaches 24.2°. Find μs.", "answer": "0.45"}, {"id": "D4", "topic": "Inclined Planes", "text": "A 12.0 kg block is placed on a 20.0° incline with μs = 0.35. Will it slide? Support your answer with a calculation.", "answer": "Yes: the down-slope component 40.2 N exceeds the maximum static friction 38.7 N"}, {"id": "D5", "topic": "Inclined Planes", "text": "A 10.0 kg block on a 30.0° incline (μs = 0.20) is now pushed by a force parallel to the slope so that it is on the verge of sliding up. Find the required force, and compare with Example 3.10.", "answer": "66.0 N (friction now acts down the slope, so the force must overcome both the weight component and friction)"}, {"id": "E1", "topic": "Connected Objects", "text": "Masses of 4.00 kg and 6.00 kg hang from an Atwood machine. Find the acceleration and the tension.", "answer": "1.96 m/s²; 47.0 N"}, {"id": "E2", "topic": "Connected Objects", "text": "A 5.00 kg block on a frictionless table is connected by a string over a pulley to a hanging 3.00 kg mass. Find the acceleration and the tension.", "answer": "3.68 m/s²; 18.4 N"}, {"id": "E3", "topic": "Connected Objects", "text": "Repeat E2 with μk = 0.20 between the block and the table.", "answer": "2.45 m/s²; 22.1 N"}, {"id": "E4", "topic": "Connected Objects", "text": "An 8.0 kg block on a smooth 20° face of a double incline is connected over a pulley to a 3.5 kg block on the smooth 70° face. (a) Determine which way the system moves. (b) Find the acceleration and the tension.", "answer": "(a) toward the 3.5 kg side (32.2 N vs 26.8 N) (b) 0.47 m/s²; 30.6 N"}, {"id": "E5", "topic": "Connected Objects", "text": "Two blocks of 3.00 kg and 5.00 kg are in contact on a frictionless table. A 16.0 N horizontal force pushes on the 3.00 kg block. Find the acceleration of the pair and the force the 3.00 kg block exerts on the 5.00 kg block.", "answer": "2.00 m/s²; 10.0 N Conceptual Review"}], "mc": [{"id": "MC1", "topic": "Conceptual Review", "text": "The property of an object that resists changes in its velocity is called (a) inertia (b) weight (c) friction (d) momentum", "answer": "(a)"}, {"id": "MC2", "topic": "Conceptual Review", "text": "The action and reaction forces of Newton's third law (a) act on the same body and cancel (b) act on the same body but do not cancel (c) act on different bodies (d) are equal only in equilibrium", "answer": "(c)"}, {"id": "MC3", "topic": "Conceptual Review", "text": "A block rests on an incline of angle θ. The normal force on it is (a) mg (b) mg cosθ (c) mg sinθ (d) mg tanθ", "answer": "(b)"}, {"id": "MC4", "topic": "Conceptual Review", "text": "The kinetic friction force on a sliding block depends on (a) the area of contact (b) the normal force (c) the sliding speed (d) all of these", "answer": "(b)"}, {"id": "MC5", "topic": "Conceptual Review", "text": "In an Atwood machine with unequal masses, the tension in the string is (a) equal to the heavier weight (b) equal to the lighter weight (c) between the two weights (d) equal to the difference of the weights", "answer": "(c)"}]}, {"num": 4, "title": "Work, Energy, and the Conservation of Energy", "short": "Work & Energy", "objectives": ["Define the work done by a constant force, W = Fd cosθ, and determine its sign.", "Define kinetic energy and apply the work–energy theorem.", "Define gravitational and elastic potential energy and list the other forms of potential energy.", "State the law of conservation of energy and apply conservation of mechanical energy to pendulums, curved tracks, and connected objects.", "Account for friction and other non-conservative forces in the energy equation and calculate the mechanical energy converted to heat.", "Define power, use P = W/t and P = Fv, and calculate the power of engines and motors."], "sections": [{"num": "4.1", "title": "Introduction", "paragraphs": ["Chapters 2 and 3 analysed motion through forces and accelerations — vector quantities that must be tracked instant by instant. This chapter introduces a different and often far simpler approach based on energy. Energy is a scalar, it comes in several interchangeable forms, and — most importantly — its total amount in an isolated system never changes. For many problems (a pendulum swinging, a skier descending a curved slope, blocks connected over a pulley) the energy method gives the answer in one line where the force method would require a difficult or impossible calculation of the acceleration along the path. The chapter first defines work and kinetic energy and connects them through the work–energy theorem, then introduces potential energy and the principle of conservation of energy, shows how friction is handled, and finishes with power — the rate at which work is done."]}, {"num": "4.2", "title": "Work", "paragraphs": ["In physics, work has a precise meaning that is narrower than its everyday one. A constant force F⃗ does work on an object only when the object moves, and only the component of the force along the displacement counts. If the force makes an angle θ with the displacement d⃗ (Figure 4.1), the work done is W = F d cos θ", "Work is a scalar; its SI unit is the joule (J), where 1 J = 1 N·m. Three cases fix the sign: when the force has a component in the direction of motion (θ < 90°) the work is positive, as when gravity acts on a falling object; when it has a component opposite to the motion (θ > 90°) the work is negative, as for friction, which always opposes sliding, or for gravity acting on a rising object; and when the force is perpendicular to the motion (θ = 90°) it does no work at all, however large it is — the normal force on a sliding block and the tension in a pendulum string are examples. Holding a heavy suitcase stationary is tiring, but since d = 0 no work is done in the physics sense. The work done by gravity deserves special mention because it appears in so many problems. When an object of mass m descends through a vertical height h, whether it falls straight down or slides along a slope of any shape, the work done by gravity is Wg = +mgh; when it rises through h, Wg = −mgh. Only the vertical displacement matters."]}, {"num": "4.3", "title": "Kinetic Energy and the Work–Energy Theorem", "paragraphs": ["The kinetic energy of an object is the energy it possesses because of its motion: KE = ½ m v² It is a scalar measured in joules, and it depends on the square of the speed: doubling the speed quadruples the kinetic energy. Combining the second law with the constant-acceleration relation v² = v₀² + 2ad gives the work–energy theorem:", "Work–Energy Theorem The net work done on an object by all the forces acting on it equals the change in its kinetic energy: Wnet = ΔKE = ½ m v² − ½ m v0²", "Positive net work speeds an object up; negative net work slows it down. The theorem holds for any forces, constant or not, and is the bridge between the force description of Chapter 3 and the energy description of this chapter."]}, {"num": "4.4", "title": "Potential Energy", "paragraphs": ["Potential energy is energy that an object has because of its position or configuration — energy that is stored and can later be converted into kinetic energy. Several kinds are met in physics: gravitational potential energy (a raised object), elastic potential energy (a stretched or compressed spring), electrostatic potential energy (separated charges, Chapter 8) and magnetic potential energy. This chapter uses the first two.", "4.4.1 Gravitational Potential Energy To lift an object of mass m through a height h at constant speed, an upward force equal to mg must act through the distance h, doing work mgh. That work is stored as gravitational potential energy: PEg = m g h where h is the height above a chosen reference level at which PE = 0. The choice is arbitrary — the ground, a table top, the lowest point of a swing — because only changes in potential energy have physical meaning. Lowering an object releases the stored energy: gravity does positive work mgh and the object gains kinetic energy. In general the change in gravitational potential energy is the negative of the work done by gravity, ΔPEg = −Wg.", "4.4.2 Elastic Potential Energy A spring that is stretched or compressed by a distance x from its natural length exerts a restoring force F = −kx (Hooke's law), where k is the spring constant in N/m. Because the force grows with x, the work needed to deform the spring is the average force ½kx times the distance x, and this is the elastic potential energy stored (Figure 4.3): PEs = ½ k x²", "The energy is the same whether the spring is stretched or compressed by x, since x appears squared, and it grows rapidly with deformation: doubling the stretch stores four times the energy."]}, {"num": "4.5", "title": "The Law of Conservation of Energy", "paragraphs": ["Conservation of Mechanical Energy In any isolated system of objects in which only conservative forces (such as gravity and spring forces) do work, the total mechanical energy — the sum of kinetic and potential energies — is conserved: Ef = Ei i.e. KEf + PEf = KEi + PEi", "The statement follows from the work–energy theorem: if gravity is the only force doing work, then W net = Wg = −ΔPE, and Wnet = ΔKE, so ΔKE + ΔPE = 0. Energy is not created or destroyed; it is only converted from one form to the other. Figure 4.2 illustrates this for a ball on a frictionless track: at the highest point all the energy is potential, at the lowest point all is kinetic, and at every intermediate point the two add to the same total.", "The practical power of the law is that the speed at any point depends only on the height there, not on the shape of the track or the details of the forces along the way. Problems that would be very difficult by Newton's laws — because the normal force and hence the acceleration change continuously — become a single line of algebra.", "Problem-solving strategy — energy conservation 1. Identify the initial and final states of interest and sketch them. 2. Choose a reference level for PE = 0 (usually the lowest point involved). 3. Write KE and PE for each state; set an unknown speed or height as the variable. 4. If only gravity and spring forces do work, set KEi + PEi = KEf + PEf. If friction or an applied force does work, use the extended form of Section 4.6 instead. 5. Solve, and check that the answer makes sense (for example, a speed should increase when height decreases)."]}, {"num": "4.6", "title": "Energy Conservation with Friction", "paragraphs": ["Friction is a non-conservative force: the work it does depends on the path taken and cannot be recovered, because it is converted into thermal energy (the surfaces warm up). When friction or another non- conservative force does work Wnc on the system, mechanical energy is no longer conserved by itself, but the total energy still is. The work–energy theorem gives the generalized statement: KEi + PEi + Wnc = KEf + PEf or Wnc = ΔKE + ΔPE Since friction opposes motion, its work is negative, Wf = −f d, and the mechanical energy decreases by exactly f d. The “missing” energy is not lost — it appears as heat — so energy in the broadest sense is always conserved; only mechanical energy fails to be."]}, {"num": "4.7", "title": "Power", "paragraphs": ["Power is the rate at which work is done, or equivalently the rate at which energy is transferred: P = W/Δt The SI unit is the watt, 1 W = 1 J/s; the kilowatt (1 kW = 1000 W) and the horsepower (1 hp = 746 W) are also common. Because W = F d cosθ and d/Δt is the speed, the power delivered by a force F acting along the direction of motion of an object moving at speed v is P=Fv This form is especially useful for vehicles and lifting machinery moving at constant speed, where the driving force just balances the opposing forces."]}], "examples": [{"id": "4.1", "title": "Work done by gravity on a sliding body", "section": "4.2", "problem": "A 0.50 kg body slides from rest down a smooth incline of angle 30° from a vertical height of 5.0 m. Find (a) the work done by gravity on the body and (b) the average power developed if the descent takes 5.0 s.", "solution": ""}, {"id": "4.2", "title": "Braking force from the work–energy theorem", "section": "4.3", "problem": "A 1200 kg car coasting down a 30° slope reaches 12 m/s when the driver applies the brakes. What constant braking force (parallel to the slope) brings the car to rest after a further 100 m?", "solution": ""}, {"id": "4.3", "title": "Lifting a bucket from a well", "section": "4.4", "problem": "A man lifts a 20 kg bucket from a well at constant speed and does 6.0 kJ of work. How deep is the well?", "solution": ""}, {"id": "4.4", "title": "A pendulum", "section": "4.5", "problem": "A pendulum bob is pulled aside and released from rest at a point B that is a height h above its lowest point A. Find the speed of the bob as it passes through A, and evaluate it for h = 0.50 m.", "solution": ""}, {"id": "4.5", "title": "A ball on a curved track", "section": "4.5", "problem": "A 4.0 kg ball starts from rest at point A on a frictionless curved track, 5.00 m above the lowest point B. It then rises to a point C that is 2.00 m above B. Find its speed at B and at C.", "solution": ""}, {"id": "4.6", "title": "Two connected blocks", "section": "4.5", "problem": "Blocks m₁ = 3.0 kg and m₂ = 5.0 kg are connected by a light string over a frictionless pulley. Initially m₂ is held 5.0 m above the ground while m₁ rests on the ground. The system is released. Find the speed of m₂ just before it reaches the ground.", "solution": ""}, {"id": "4.7", "title": "A block sliding down a rough incline", "section": "4.6", "problem": "A 3.00 kg block starts from rest at the top of a 1.00 m slope inclined at 30.0° and slides down against a constant friction force of 5.00 N. Use energy conservation to find its speed at the bottom.", "solution": ""}, {"id": "4.8", "title": "Sliding down a cable", "section": "4.6", "problem": "An 85 kg stunt person slides from rest down a 50 m cable from a building to the ground 30 m below, arriving at 20 m/s. Find (a) the change in gravitational potential energy, (b) the kinetic energy on arrival, (c) the work done by friction, and (d) the magnitude of the friction force.", "solution": ""}, {"id": "4.9", "title": "A skier on a frictionless slope and a rough runout", "section": "4.6", "problem": "A skier starts from rest at the top of a frictionless slope 20.0 m high, then slides onto a level, rough surface where μk = 0.210 between skis and snow (Figure 4.4). Find (a) the speed at the bottom of the slope and (b) the distance travelled on the level surface before stopping.", "solution": ""}, {"id": "4.10", "title": "The power to accelerate a vehicle", "section": "4.7", "problem": "A small vehicle of mass 120 kg accelerates from rest to 25 m/s in 8.0 s. What average power must its engine deliver?", "solution": ""}, {"id": "4.11", "title": "An elevator motor", "section": "4.7", "problem": "An elevator car of mass 1600 kg carrying passengers of total mass 200 kg rises at a constant 3.0 m/s. A constant friction force of 4000 N opposes the motion. What power must the motor deliver?", "solution": ""}], "summary": ["Work is done only by the component of a force along the displacement; forces perpendicular to the motion (normal force, string tension in a pendulum) do no work.", "Only changes in potential energy matter, so the PE = 0 reference level may be chosen for convenience.", "When only gravity and spring forces do work, the speed at any point depends only on the height there — not on the path or the mass.", "Friction converts mechanical energy into thermal energy; its work is −f d and must be added to the left-hand side of the conservation equation.", "Work (constant force): W = F d cosθ [joule, J = N·m]", "Kinetic energy: KE = ½ m v² [J]", "Work–energy theorem: Wnet = ΔKE = ½ m v² − ½ m v0² [J]", "Gravitational PE: PEg = m g h [J]", "Elastic PE: PEs = ½ k x² [J]", "Mechanical energy: E = KE + PE [J]", "Conservation (no friction): KEi + PEi = KEf + PEf [—]", "With non-conservative work: KEi + PEi + Wnc = KEf + PEf [—]", "Power: P = W/Δt = F v [watt, W = J/s]"], "problems": [{"id": "A1", "topic": "Work and Kinetic Energy", "text": "A 50 N force pulls a crate 8.0 m across a floor. Find the work done by the force if it acts (a) along the displacement, (b) at 60° to the displacement, (c) perpendicular to the displacement.", "answer": "(a) 400 J (b) 200 J (c) 0"}, {"id": "A2", "topic": "Work and Kinetic Energy", "text": "A 2.0 kg book is lifted 3.0 m at constant speed. Find the work done (a) by the person lifting it and (b) by gravity.", "answer": "(a) +58.8 J (b) −58.8 J"}, {"id": "A3", "topic": "Work and Kinetic Energy", "text": "A friction force of 12 N acts on a sliding box that moves 15 m. How much work does friction do?", "answer": "−180 J"}, {"id": "A4", "topic": "Work and Kinetic Energy", "text": "Find the kinetic energy of a 0.145 kg baseball moving at 40 m/s.", "answer": "116 J"}, {"id": "A5", "topic": "Work and Kinetic Energy", "text": "How much net work is needed to accelerate a 1500 kg car from 10 m/s to 30 m/s?", "answer": "6.0 × 10⁵ J"}, {"id": "A6", "topic": "Work and Kinetic Energy", "text": "An 800 kg car moving at 20 m/s is stopped in 50 m by a constant braking force on a level road. Find the force.", "answer": "3.2 × 10³ N"}, {"id": "B1", "topic": "Potential Energy and Conservation of Energy", "text": "A 0.20 kg ball is dropped from a height of 12 m. Find (a) its initial potential energy relative to the ground and (b) its speed just before hitting the ground, using energy conservation.", "answer": "(a) 23.5 J (b) 15.3 m/s"}, {"id": "B2", "topic": "Potential Energy and Conservation of Energy", "text": "A spring with k = 400 N/m is stretched by 0.15 m. How much energy does it store? How much if the stretch is doubled?", "answer": "4.5 J; 18 J"}, {"id": "B3", "topic": "Potential Energy and Conservation of Energy", "text": "A roller-coaster car starts from rest at the top of a 40 m hill. Neglecting friction, find its speed (a) at the bottom and (b) at the top of a second hill 15 m high.", "answer": "(a) 28.0 m/s (b) 22.1 m/s"}, {"id": "B4", "topic": "Potential Energy and Conservation of Energy", "text": "Use energy conservation to find the maximum height reached by a ball thrown vertically upward at 15 m/s. Compare with the kinematics result of Chapter 2.", "answer": "11.5 m (the same as v₀²/2g)"}, {"id": "B5", "topic": "Potential Energy and Conservation of Energy", "text": "A pendulum of length 2.0 m is pulled aside until the string makes 40° with the vertical and released from rest. Find its speed at the lowest point. (Hint: h = L(1 − cosθ).)", "answer": "3.03 m/s"}, {"id": "B6", "topic": "Potential Energy and Conservation of Energy", "text": "Masses of 2.0 kg and 6.0 kg hang from an Atwood machine and are released from rest. Use energy conservation to find their common speed after the 6.0 kg mass has fallen 3.0 m.", "answer": "5.42 m/s"}, {"id": "C1", "topic": "Energy with Friction", "text": "A 10 kg box slides from rest down a 4.0 m long slope inclined at 25° with μ k = 0.15. Find its speed at the bottom.", "answer": "4.74 m/s"}, {"id": "C2", "topic": "Energy with Friction", "text": "A 30 kg sled is moving at 6.0 m/s on level snow with μk = 0.10. How far does it travel before stopping?", "answer": "18.4 m"}, {"id": "C3", "topic": "Energy with Friction", "text": "A 25 kg child starts from rest at the top of a 3.0 m high slide and reaches the bottom at 5.0 m/s. How much energy was converted to heat by friction?", "answer": "422 J"}, {"id": "C4", "topic": "Energy with Friction", "text": "Repeat Example 4.9 for a slope 30.0 m high and a runout with μk = 0.15.", "answer": "24.2 m/s; 200 m"}, {"id": "D1", "topic": "Power", "text": "A 75 kg person climbs a flight of stairs 4.0 m high in 5.0 s. Find the average power output.", "answer": "588 W"}, {"id": "D2", "topic": "Power", "text": "A motor lifts a 500 kg load at a constant 2.0 m/s. What power does it deliver?", "answer": "9.8 kW"}, {"id": "D3", "topic": "Power", "text": "A car engine delivers 60 kW while the car travels at a constant 25 m/s on a level road. Find the total resisting force on the car.", "answer": "2.4 × 10³ N"}, {"id": "D4", "topic": "Power", "text": "A pump raises 500 kg of water through 20 m in one minute. Find its power output.", "answer": "1.6 kW Conceptual Review"}], "mc": [{"id": "MC1", "topic": "Conceptual Review", "text": "The work done by the normal force on a block sliding down an incline is (a) positive (b) negative (c) zero (d) equal to mgh", "answer": "(c)"}, {"id": "MC2", "topic": "Conceptual Review", "text": "If the speed of an object is doubled, its kinetic energy (a) doubles (b) triples (c) becomes four times larger (d) is unchanged", "answer": "(c)"}, {"id": "MC3", "topic": "Conceptual Review", "text": "The level at which gravitational potential energy is taken as zero (a) must be the ground (b) may be chosen freely, since only changes in PE matter (c) must be the lowest point of the motion (d) is fixed by the mass of the object", "answer": "(b)"}, {"id": "MC4", "topic": "Conceptual Review", "text": "When a block slides to rest on a rough surface, its kinetic energy (a) is destroyed (b) is converted mainly into thermal energy (c) becomes potential energy (d) is transferred to the Earth's motion", "answer": "(b)"}, {"id": "MC5", "topic": "Conceptual Review", "text": "One watt is equal to (a) one joule per second (b) one newton per second (c) one joule per metre (d) one newton-metre", "answer": "(a)"}]}];

نقطة حيث v = 0."], "Throw straight up": ["القذف رأسيًا إلى أعلى", "الصعود والهبوط متماثلان."], "Projectile components": ["مركّبات المقذوف", "الحركتان الأفقية والرأسية مستقلتان ولا يربطهما إلا الزمن t."], "Projectile on level ground": ["مقذوف على أرض مستوية", "أقصى مدى عند 45°. لارتفاعات هبوط مختلفة: حلّ المعادلة الرأسية لإيجاد t أولًا."], "Weight": ["الوزن", "قوة تُقاس بالنيوتن؛ أما الكتلة فلا تتغير من مكان إلى آخر."], "Second law": ["القانون الثاني", "يُطبَّق بالمركّبات انطلاقًا من مخطط الجسم الحر."], "Static friction": ["الاحتكاك السكوني", "يتكيّف لمنع الانزلاق حتى قيمته العظمى."], "Kinetic friction": ["الاحتكاك الحركي", "ثابت أثناء الانزلاق؛ μk < μs."], "Equilibrium": ["الاتزان", "أجسام معلّقة، حبال بزوايا."], "Incline: normal force": ["المستوى المائل: القوة العمودية", "من المعادلة العمودية؛ تتغير بأي قوة مائلة مؤثرة."], "Frictionless incline": ["مستوى مائل أملس", "مركّبة الوزن على امتداد الميل mg sinθ."], "Rough incline": ["مستوى مائل خشن", "يبدأ الانزلاق عندما tanθ = μs."], "Atwood machine": ["آلة أتوود", "الأجسام المتصلة تشترك في شدّ واحد ومقدار تسارع واحد."], "Work (constant force)": ["الشغل (قوة ثابتة)", "جول، J = N·m. القوى العمودية على الحركة لا تبذل شغلًا."], "Kinetic energy": ["طاقة الحركة", ""], "Work–energy theorem": ["نظرية الشغل والطاقة", "قوة الكبح، والشغل الكلي اللازم لزيادة السرعة."], "Gravitational PE": ["طاقة الوضع الجاذبية", "اختر مستوى PE = 0 بما يناسبك؛ التغيرات وحدها هي المهمة."], "Elastic PE": ["طاقة الوضع المرنة", ""], "Conservation of energy": ["حفظ الطاقة", "عندما تبذل الجاذبية والنوابض وحدها الشغل."], "Energy with friction": ["الطاقة مع الاحتكاك", "يحوّل الاحتكاك الطاقة الميكانيكية إلى طاقة حرارية."], "Power": ["القدرة", "واط، W = J/s."]}, "objectives": {"1": ["التمييز بين الكميات الفيزيائية والوحدات، وبين الكميات الأساسية والمشتقة.", "ذكر وحدات النظام الدولي (SI) الأساسية السبع واستخدام بادئات SI استخدامًا صحيحًا.", "تحويل القياسات بين أنظمة الوحدات (SI وCGS والنظام الأمريكي) بطريقة معامل التحويل.", "حساب حجم وكثافة الأجسام الصلبة المنتظمة وتحويل الكثافات بين أنظمة الوحدات.", "تحويل نقطة بين الإحداثيات الديكارتية والقطبية، وتطبيق حساب مثلثات المثلث القائم.", "التمييز بين الكميات القياسية والمتجهة وتحديد أمثلة على كل منهما.", "جمع المتجهات وطرحها بيانيًا (طريقتا المثلث ومتوازي الأضلاع) وتحليليًا (المركّبات وقانون جيوب التمام).", "حساب الضرب القياسي (النقطي) والضرب الاتجاهي (التقاطعي) لمتجهين وتطبيق قاعدة اليد اليمنى.", "التعرّف على تطبيقات الضرب القياسي والاتجاهي في الميكانيكا (الشغل، والعزم، والزخم الزاوي)."], "2": ["تعريف الكينماتيكا والتمييز بين المسافة والإزاحة، وبين السرعة والسرعة المتجهة.", "حساب السرعة المتجهة المتوسطة والسرعة المتوسطة والتسارع من بيانات الموضع والزمن.", "تفسير منحنيات الموضع–الزمن والسرعة–الزمن: قراءة السرعة المتجهة من ميل منحنى x–t، والتسارع والإزاحة من منحنى v–t.", "تطبيق معادلات الحركة الأربع بتسارع ثابت لحل مسائل في بُعد واحد.", "تحليل حركة السقوط الحر (أجسام تُترك أو تُقذف إلى أسفل أو إلى أعلى) باستخدام اصطلاح إشارات متسق.", "تحليل حركة المقذوف إلى مركّبتين مستقلتين أفقية ورأسية، وحساب زمن الطيران وأقصى ارتفاع والمدى."], "3": ["ذكر قوانين نيوتن الثلاثة للحركة وشرح مفاهيم القوة والقصور الذاتي والكتلة.", "تطبيق ΣF⃗ = ma⃗ لإيجاد تسارع جسم تؤثر فيه عدة قوى، باستخدام طرق المتجهات من الفصل الأول.", "تحديد أزواج الفعل ورد الفعل والتمييز بينها وبين القوى المتزنة المؤثرة في جسم واحد.", "رسم مخطط الجسم الحر لأي جسم واستخدامه لكتابة قانون نيوتن الثاني بصيغة المركّبات.", "وصف الاحتكاك السكوني والحركي، واستخدام المعاملين μs وμk، وحل مسائل يؤثر فيها الاحتكاك.", "حل مسائل الاتزان (كتل معلّقة، وقطع مثبّتة على مستويات مائلة) ومسائل الديناميكا على المستويات المائلة.", "تحليل الأنظمة المتصلة — آلات أتوود والقطع المربوطة عبر البكرات — لإيجاد تسارعها المشترك والشد في الخيط."], "4": ["تعريف الشغل الذي تبذله قوة ثابتة، W = Fd cosθ، وتحديد إشارته.", "تعريف طاقة الحركة وتطبيق نظرية الشغل والطاقة.", "تعريف طاقة الوضع الجاذبية والمرنة وذكر صور طاقة الوضع الأخرى.", "ذكر قانون حفظ الطاقة وتطبيق حفظ الطاقة الميكانيكية على البندولات والمسارات المنحنية والأجسام المتصلة.", "مراعاة الاحتكاك والقوى غير المحافظة الأخرى في معادلة الطاقة وحساب الطاقة الميكانيكية المتحوّلة إلى حرارة.", "تعريف القدرة، واستخدام P = W/t وP = Fv، وحساب قدرة المحركات."]}, "summary": {"1": ["الكمية الفيزيائية مقدار مقرون بوحدة؛ والكميات الأساسية (الطول، الكتلة، الزمن، التيار، درجة الحرارة، كمية المادة، شدة الإضاءة) مستقلة، وتُشتق منها الكميات الأخرى جميعها.", "منذ عام 2019 تُعرَّف وحدات SI الأساسية السبع كلها بتثبيت قيمة ثابت فيزيائي أساسي، لا بجسم مادي مرجعي.", "تُجرى تحويلات الوحدات بأمان بمعاملات التحويل — كسور تساوي 1 — تُختار بحيث تُلغى الوحدات غير المطلوبة.", "أحجام الأجسام الصلبة المنتظمة: V = lbh (متوازي المستطيلات)، V = ¼πd²h (الأسطوانة)، V = ⁴⁄₃π(d/2)³ (الكرة)؛ والكثافة ρ = m/V.", "يمكن وصف النقطة بإحداثيات ديكارتية (x, y) أو قطبية (r, θ) تربطها العلاقات x = r cosθ، y = r sinθ، r = √(x²+y²)، θ = tan⁻¹(y/x) — مع التحقق دائمًا من ربع النقطة (x, y).", "إحداثيات GPS زوايا تُحوَّل إلى مسافات محلية على الخريطة بالعلاقتين ΔY = 111,320 × Δlat وΔX = 111,320 × cosφ̄ × Δlon (بالأمتار، وΔlat وΔlon بالدرجات)؛ ثم المسافة بين نقطتين متجاورتين d = √(ΔX² + ΔY²).", "للكميات القياسية مقدار فقط؛ وللمتجهات مقدار واتجاه. تُجمع المتجهات بيانيًا (طريقة المثلث أو متوازي الأضلاع) أو تحليليًا (المركّبات، أو قانون جيوب التمام عندما يكون لدينا متجهان فقط والزاوية بينهما).", "طريقة المركّبات: Rx = ΣAx، Ry = ΣAy، ثم R = √(Rx²+Ry²) وθ = tan⁻¹(Ry/Rx).", "طريقة قانون جيوب التمام: R = √(A²+B²+2AB cosθ)، حيث θ الزاوية بين المتجهين.", "الضرب القياسي A⃗ ·B⃗ = AB cosθ = AxBx+AyBy كمية قياسية؛ يساوي صفرًا للمتجهين المتعامدين، وهو أساس تعريف الشغل W = F⃗·d⃗.", "الضرب الاتجاهي A⃗ ×B⃗ مقداره AB sinθ واتجاهه بقاعدة اليد اليمنى؛ يساوي صفرًا للمتجهين المتوازيين، وهو أساس تعريف العزم τ⃗ = r⃗×F⃗."], "2": ["الإزاحة Δx = xf − xi متجه (التغير في الموضع على خط مستقيم)؛ والمسافة الطول القياسي للمسار. يتساويان فقط في الحركة باتجاه واحد دون رجوع.", "السرعة المتجهة المتوسطة v̄ = Δx/Δt متجه؛ والسرعة المتوسطة = المسافة الكلية/الزمن الكلي كمية قياسية. في الرحلة ذهابًا وإيابًا تكون السرعة المتجهة المتوسطة صفرًا، أما السرعة المتوسطة فلا.", "السرعة المتجهة اللحظية هي ميل منحنى x–t. والتسارع a = Δv/Δt ميل منحنى v–t، والمساحة تحت منحنى v–t هي الإزاحة (المساحات تحت المحور تُعدّ سالبة).", "للتسارع الثابت: v = v0 + at ؛ x = ½(v0 + v)t ؛ x = v0 t + ½at² ؛ v² = v0² + 2ax. اختر المعادلة التي تخلو من الكمية التي لا تعرفها ولا تحتاجها.", "السقوط الحر حركة بتسارع ثابت a = −g = −9.80 m/s² (الاتجاه إلى أعلى موجب) في كل لحظة، بما فيها أعلى نقطة حيث v = 0. القذف إلى أعلى متماثل: t up = v0/g، H = v0²/(2g)، ويعود الجسم إلى ارتفاع الانطلاق بسرعة v = −v0.", "الحركة الأفقية للمقذوف (vx = v0 cosθ ثابتة) والحركة الرأسية (سقوط حر بـ v0y = v0 sinθ) مستقلتان ولا يربطهما إلا الزمن. على أرض مستوية: T = 2v0 sinθ/g، H = v0² sin²θ/(2g)، R = v0² sin 2θ/g (أقصى مدى عند 45°). لارتفاعات هبوط أخرى، حُلّ المعادلة الرأسية لإيجاد t أولًا."], "3": ["القانون الأول: يحافظ الجسم على سرعته المتجهة (صفرًا أو غير صفر) ما لم تؤثر فيه قوة محصلة. القصور الذاتي هو هذا الميل، والكتلة (kg) مقياسه. الوزن W = mg قوة (N) لا كتلة.", "القانون الثاني: ΣF⃗ = ma⃗ ، ويُطبَّق بالمركّبات: ΣFx = max، ΣFy = may. اتجاه التسارع هو اتجاه القوة المحصلة.", "القانون الثالث: تحدث القوى أزواجًا متساوية ومتعاكسة تؤثر في جسمين مختلفين. أزواج الفعل ورد الفعل لا تلغي بعضها أبدًا؛ ووزن الجسم والقوة العمودية عليه ليسا زوجًا من هذا النوع.", "الاحتكاك: fs ≤ μs n (سكوني، يتكيّف لمنع الانزلاق)؛ fk = μk n (حركي، ثابت أثناء الانزلاق)؛ μk < μs. تُوجد القوة العمودية من المعادلة العمودية وتتغير بأي قوة مائلة مؤثرة.", "الإجراء: اعزل الجسم، وارسم مخطط الجسم الحر، واختر المحاور (موازية وعمودية على أي مستوى مائل)، وحلّل القوى، وطبّق القانون الثاني على امتداد كل محور. الاتزان يعني ΣF⃗ = 0.", "المستوى المائل: n = mg cosθ؛ وعلى امتداد الميل يسهم الوزن بـ mg sinθ. أملس: a = g sinθ. خشن: a = g(sinθ − μk cosθ). يبدأ الجسم بالانزلاق عندما tanθ = μs.", "الأجسام المتصلة تشترك في شد واحد ومقدار تسارع واحد. اكتب القانون الثاني لكل جسم في اتجاه حركته، واجمع لإيجاد a، ثم عوّض لإيجاد T. آلة أتوود: a = (m₂ − m₁)g/(m₁ + m₂)."], "4": ["يُبذل الشغل فقط بمركّبة القوة على امتداد الإزاحة؛ والقوى العمودية على الحركة (القوة العمودية، شد الخيط في البندول) لا تبذل شغلًا.", "التغيرات في طاقة الوضع وحدها هي المهمة، لذا يمكن اختيار مستوى المرجع PE = 0 بما يناسب.", "عندما تبذل الجاذبية والنوابض وحدها الشغل، تعتمد السرعة عند أي نقطة على ارتفاعها فقط — لا على المسار ولا على الكتلة.", "يحوّل الاحتكاك الطاقة الميكانيكية إلى طاقة حرارية؛ شغله −f d ويجب إضافته إلى الطرف الأيسر من معادلة الحفظ.", "الشغل (قوة ثابتة): W = F d cosθ [جول، J = N·m]", "طاقة الحركة: KE = ½ m v² [J]", "نظرية الشغل والطاقة: Wnet = ΔKE = ½ m v² − ½ m v0² [J]", "طاقة الوضع الجاذبية: PEg = m g h [J]", "طاقة الوضع المرنة: PEs = ½ k x² [J]", "الطاقة الميكانيكية: E = KE + PE [J]", "الحفظ (بدون احتكاك): KEi + PEi = KEf + PEf", "مع شغل غير محافظ: KEi + PEi + Wnc = KEf + PEf", "القدرة: P = W/Δt = F v [واط، W = J/s]"]}, "paragraphs": {"1.1": ["الفيزياء في جوهرها علم قياس. فكل قانون فيزيائي — من قوانين نيوتن للحركة إلى المعادلات التي تصف موصلية صفيحة الغرافين — هو عبارة تربط بين كميات يمكن، من حيث المبدأ، قياسها في المختبر. وقبل أن نختبر أي علاقة من هذا النوع أو نطبّقها، نحتاج إلى لغة مشتركة ودقيقة للتعبير عن «كم المقدار» و«كم المسافة» و«في أي اتجاه». تلك اللغة هي موضوع هذا الفصل. يبني هذا الفصل (الذي يقابل المحاضرات 1–12 من المقرر) أساسين سيُستخدمان طوال المقرر. الأول هو القياس نفسه: ما الكمية الفيزيائية، وكيف يحدد النظام الدولي للوحدات (SI) مجموعة مشتركة من المعايير، وكيف نحوّل بثقة بين أنظمة الوحدات. والثاني هو رياضيات المتجهات: الأداة المستخدمة لوصف أي كمية — الإزاحة، والسرعة المتجهة، والقوة، والعزم — لها مقدار واتجاه معًا. وكل موضوع تقريبًا في الميكانيكا والكهرباء والمغناطيسية يأتي لاحقًا في هذا المقرر مبني على الأفكار المقدَّمة هنا، لذا فإن الوقت المستثمر في إتقانها الآن يؤتي ثماره طوال الفصل الدراسي."], "2.1": ["الكينماتيكا فرع الميكانيكا الذي يصف كيف تتحرك الأجسام — موضعها وسرعتها المتجهة وتسارعها بوصفها دوالّ في الزمن — دون أن يسأل عن سبب الحركة. أما سؤال «لماذا تتحرك الأجسام» (القوى) فهو موضوع الديناميكا التي تبدأ في الفصل الثالث. الجسم الذي يتحرك على مسار مستقيم، كسيارة على طريق مستقيم أو كرة تُترك من نافذة، يُقال إنه في حركة انتقالية في بُعد واحد؛ ويبدأ هذا الفصل من هناك ثم يمدّ الأفكار نفسها إلى حركة المقذوفات في بُعدين. يبني الفصل مباشرة على الفصل الأول؛ فالإزاحة والسرعة المتجهة والتسارع كلها متجهات، وطريقة المركّبات في القسم 1.7 هي بالضبط ما يسمح بتقسيم حركة المقذوف إلى مسألتين أبسط ومستقلتين في بُعد واحد. المرجع الأساسي لهذا الفصل هو كتاب Giancoli, Physics: Principles with Applications، الفصلان 2 و3 (Giancoli, 2014)، وتتوافر نسخ منه في مركز مصادر التعلم بالجامعة."], "3.1": ["وصف الفصل الثاني كيف تتحرك الأجسام؛ ويشرح هذا الفصل لماذا. الرابط بين الحركة وأسبابها تقدّمه قوانين نيوتن الثلاثة للحركة، التي نشرها إسحاق نيوتن عام 1687 ولا تزال أساس الميكانيكا الهندسية حتى اليوم. المفهوم المركزي هو القوة — دفع أو سحب يؤثر به جسم في جسم آخر. بعض القوى تعمل بالتلامس المباشر (يد تدفع صندوقًا، الشد في حبل، الاحتكاك، دعم الأرضية)، بينما تعمل قوى الطبيعة الأساسية عن بُعد: قوة الجاذبية التي تسحب التفاحة نحو الأرض، والقوة الكهربائية بين الشحنات، والقوة المغناطيسية بين المغناطيسات أو الشحنات المتحركة. القوة كمية متجهة: اتجاهها مهم بقدر مقدارها، وعندما تؤثر عدة قوى في جسم واحد فإن مجموعها المتجه — القوة المحصلة ΣF⃗ — هو ما يحدد الحركة. وحدة القوة في النظام الدولي هي النيوتن (N)، وتُعرَّف بحيث تكسب قوة محصلة مقدارها 1 N كتلةً مقدارها 1 kg تسارعًا مقداره 1 m/s²: 1 N = 1 kg·m/s²"], "4.1": ["حلّل الفصلان الثاني والثالث الحركة من خلال القوى والتسارعات — كميات متجهة يجب تتبعها لحظة بلحظة. يقدّم هذا الفصل مقاربة مختلفة وغالبًا أبسط بكثير تعتمد على الطاقة. الطاقة كمية قياسية، وتأتي في صور عدة قابلة للتبادل، والأهم أن مقدارها الكلي في نظام معزول لا يتغير أبدًا. في كثير من المسائل (بندول يتأرجح، متزلج ينحدر على منحدر منحنٍ، قطع متصلة عبر بكرة) تعطي طريقة الطاقة الجواب في سطر واحد حيث تتطلب طريقة القوى حسابًا صعبًا أو مستحيلًا للتسارع على امتداد المسار. يعرّف الفصل أولًا الشغل وطاقة الحركة ويربطهما بنظرية الشغل والطاقة، ثم يقدّم طاقة الوضع ومبدأ حفظ الطاقة، ويبيّن كيفية التعامل مع الاحتكاك، ويختم بالقدرة — معدل بذل الشغل."], "1.2": ["1.2.1 ما الكمية الفيزيائية؟ الكمية الفيزيائية هي أي خاصية لجسم أو مادة أو ظاهرة يمكن قياسها. وتُعبَّر كل كمية فيزيائية بمقدار عددي مقرون بوحدة. فمثلًا، إذا ذُكر أن طول طاولة المختبر 1.5 m، فالعدد 1.5 هو المقدار والمتر (m) هو الوحدة. أما العدد المجرّد مثل «1.5» فليس كمية فيزيائية أصلًا — فبدون وحدة لا نعرف إن كان طول الطاولة 1.5 متر أم 1.5 قدم أم 1.5 كيلومتر. وذكر القياس دون وحدته من أكثر الأخطاء شيوعًا — وأسهلها تجنبًا — في مقرر الفيزياء التمهيدي.", "1.2.2 الكميات الأساسية والمشتقة تنقسم الكميات الفيزيائية إلى صنفين. الكميات الأساسية تُعرَّف مستقلة بعضها عن بعض؛ والطول والكتلة والزمن والتيار الكهربائي ودرجة الحرارة وكمية المادة وشدة الإضاءة هي الكميات الأساسية السبع التي يعتمدها النظام الدولي. أما الكميات المشتقة فتتكوّن بضرب الكميات الأساسية أو قسمتها — ولا تتكوّن أبدًا بجمع كميات من أنواع مختلفة أو طرحها. يبيّن الجدول 1.1 بعض الكميات المشتقة المألوفة وكيف تُبنى كل منها من الكميات الأساسية.", "الكمية الفيزيائية — مشتقة من — وحدة SI", "المساحة — الطول × الطول — m²", "الحجم — الطول × الطول × الطول — m³", "السرعة — الطول / الزمن — m/s", "الكثافة — الكتلة / الحجم — kg/m³", "التسارع — الطول / الزمن² — m/s²", "القوة — الكتلة × التسارع — kg·m/s² (نيوتن، N)", "الجدول 1.1 بعض الكميات المشتقة ووحدات SI المبنية من الوحدات الأساسية.", "1.2.3 وحدات SI الأساسية السبع كل وحدات SI الأخرى — النيوتن والجول والفولت والباسكال — تركيبات من الوحدات الأساسية السبع المذكورة في الجدول 1.2. وحتى 20 مايو 2019 كانت ست من الوحدات السبع مرتبطة بنماذج مادية أو إجراءات مختبرية (وأشهرها الكيلوغرام المعرَّف بأسطوانة من البلاتين والإيريديوم محفوظة في المكتب الدولي للأوزان والمقاييس في فرنسا). وبعد مراجعة النظام الدولي عام 2019 أصبحت الوحدات الأساسية السبع كلها تُعرَّف بتثبيت القيمة العددية الدقيقة لثابت أساسي في الطبيعة، بحيث يستطيع أي مختبر مجهّز تجهيزًا مناسبًا في أي مكان — لا المختبر الذي يحتفظ بالنموذج الأصلي فقط — أن يحقق الوحدة (NIST, 2019a; BIPM, 2019).", "الكمية — الوحدة (الرمز) — تُعرَّف بتثبيت…", "الطول — متر (m) — سرعة الضوء، c = 299,792,458 m/s", "الكتلة — كيلوغرام (kg) — ثابت بلانك، h = 6.62607015 × 10⁻³⁴ J·s", "الزمن — ثانية (s) — تردد الانتقال فوق الدقيق للسيزيوم-133، Δν = 9,192,631,770 Hz", "التيار الكهربائي — أمبير (A) — الشحنة الأولية، e = 1.602176634 × 10⁻¹⁹ C", "درجة الحرارة — كلفن (K) — ثابت بولتزمان، k = 1.380649 × 10⁻²³ J/K", "كمية المادة — مول (mol) — ثابت أفوغادرو، Nₐ = 6.02214076 × 10²³ mol⁻¹", "شدة الإضاءة — كانديلا (cd) — الفعالية الضوئية، Kcd = 683 lm/W عند 540 × 10¹² Hz", "الجدول 1.2 وحدات SI الأساسية السبع والثوابت المعرِّفة التي تثبّت مقدارها (NIST, 2019a, 2019b).", "في العمل المختبري اليومي في هذا المقرر، ثلاث من هذه الوحدات الأساسية هي الأهم: المتر (الطول) والكيلوغرام (الكتلة) والثانية (الزمن). ولأن النظام الدولي مبني على المتر والكيلوغرام والثانية فكثيرًا ما يُسمى نظام MKS.", "1.2.4 بادئات SI تتراوح الكميات المقيسة في الفيزياء من حجم نواة الذرة (~10⁻¹⁵ m) إلى حجم الكون المرئي (~10²⁶ m). وبدلًا من كتابة سلاسل طويلة من الأصفار، يُلحق النظام الدولي بادئة بالوحدة للدلالة على قوة للعدد عشرة. يعرض الجدول 1.3 البادئات الأكثر استخدامًا في هذا المقرر.", "البادئة — الرمز — المعامل | البادئة — الرمز — المعامل", "تيرا T 10¹² | سنتي c 10⁻²", "جيجا G 10⁹ | ميلي m 10⁻³", "ميجا M 10⁶ | ميكرو μ 10⁻⁶", "كيلو k 10³ | نانو n 10⁻⁹", "هكتو h 10² | بيكو p 10⁻¹²", "ديسي d 10⁻¹ | فمتو f 10⁻¹⁵", "الجدول 1.3 بادئات SI الشائعة (مقتبس من NIST SP 330, 2019a)."], "1.3": ["1.3.1 أنظمة الوحدات الشائعة تظهر ثلاثة أنظمة للوحدات كثيرًا في كتب الفيزياء التمهيدية. النظام الدولي SI (Système International d'Unités)، ويُسمى أيضًا نظام MKS، يستخدم المتر والكيلوغرام والثانية وحداتٍ أساسية للطول والكتلة والزمن، وهو النظام المستخدم في هذا المقرر كله. ونظام CGS يستخدم السنتيمتر والغرام والثانية ولا يزال شائعًا في بعض مجالات الكيمياء والكهرومغناطيسية. والنظام الأمريكي يستخدم القدم والسلغ والثانية، حيث يُعرَّف السلغ (وحدة الكتلة في النظام الأمريكي) بحيث تكسب قوة مقدارها 1 lb كتلةً مقدارها 1 slug تسارعًا مقداره 1 ft/s²؛ والسلغ الواحد يعادل نحو 14.59 kg.", "1.3.2 معاملات تحويل مفيدة يجمع الجدول 1.4 معاملات التحويل الأكثر استخدامًا في هذا المقرر. كل صف فيه مساواة — طريقتان لكتابة الطول أو الكتلة أو الفترة الزمنية الفيزيائية نفسها.", "الطول — الكتلة — الزمن", "1 mile = 1609 m = 1.609 km | 1 kg = 2.205 lb | 1 day = 24 h", "1 ft = 0.3048 m = 30.48 cm | 1 oz = 28.35 g | 1 h = 60 min = 3600 s", "1 m = 39.37 in = 3.281 ft | 1 slug = 14.59 kg | 1 day = 86,400 s", "1 in = 0.0254 m = 2.54 cm", "الجدول 1.4 معاملات التحويل المستخدمة في المقرر.", "1.3.3 طريقة معامل التحويل (معامل الوحدة) أسلم طريقة للتحويل بين الوحدات هي ضرب الكمية المعطاة في معامل تحويل واحد أو أكثر، كل منها كسر يساوي 1 بالضبط (لأن بسطه ومقامه يمثلان المقدار الفيزيائي نفسه). والوحدات التي تظهر في بسط ومقام معًا تُلغى جبريًا، فلا يبقى إلا الوحدة المطلوبة. وكتابة الوحدات في كل خطوة — لا الأعداد فقط — هي أنجع وسيلة على الإطلاق لتجنب أخطاء التحويل."], "1.4": ["1.4.1 حجم الأجسام الصلبة المنتظمة يمكن إيجاد حجم الجسم الصلب المنتظم من أبعاده الخطية، المقيسة بأداة مثل المسطرة المترية أو القدمة ذات الورنية، باستخدام القوانين في الجدول 1.5.", "الجسم المنتظم — قانون الحجم — المتغيرات", "متوازي المستطيلات — V = l × b × h — l = الطول، b = العرض، h = الارتفاع", "الأسطوانة — V = ¼ π d² h — d = القطر، h = الارتفاع", "الكرة — V = ⁴⁄₃ π (d/2)³ — d = القطر", "الجدول 1.5 قوانين الحجم للأجسام المنتظمة الشائعة.", "1.4.2 الكثافة ووحداتها كثافة المادة هي كتلتها لكل وحدة حجم، ρ = m/V. ولأن الكثافة نسبة وحدة كتلة إلى وحدة حجم، فمن السهل جدًا إضاعة معامل 1000 عند التحويل بين g/cm³ وkg/m³. والأسلم، كما هو الحال دائمًا، تحويل وحدتي الكتلة والحجم كلًا على حدة وتركهما تُلغيان."], "1.5": ["1.5.1 الإحداثيات الديكارتية (المستطيلة) والقطبية يمكن تحديد موضع أي نقطة في المستوى بأكثر من طريقة. في النظام الديكارتي تُحدَّد النقطة P ببعديها العموديين (x, y) عن محورين ثابتين متعامدين. وفي النظام القطبي تُحدَّد النقطة نفسها بدلًا من ذلك بمسافة r عن نقطة أصل ثابتة وزاوية θ تُقاس من خط مرجعي ثابت هو عادةً محور x الموجب. يبيّن الشكل 1.1 الوصفين للنقطة نفسها.", "يربط الوصفين علاقات مثلثية بسيطة. للانتقال من الإحداثيات القطبية إلى الديكارتية: x = r cos θ ، y = r sin θ. وللانتقال من الديكارتية إلى القطبية: r = √(x² + y²) ، θ = tan⁻¹(y / x).", "1.5.2 مراجعة حساب مثلثات المثلث القائم تحويلات الإحداثيات أعلاه ليست سوى نظرية فيثاغورس والنسب المثلثية الأساسية مطبّقة على المثلث القائم الذي تكوّنه x وy وr. يراجع الشكل 1.2 هذه العلاقات لمثلث قائم عام وتره h، وضلعه المقابل للزاوية θ («العمودي»، p)، وضلعه المجاور لها («القاعدة»، b).", "وتربط نظرية فيثاغورس أضلاع أي مثلث قائم الثلاثة: h² = p² + b²", "خطأ شائع لدى الطلاب — انتبه للربع! دالة tan⁻¹ (arctan) في الآلة الحاسبة تعطي دائمًا زاوية بين −90° و+90°، بينما قد تقع النقطة (x, y) في أي من الأرباع الأربعة. قبل أن تثق بجواب الآلة الحاسبة للزاوية θ، ارسم النقطة دائمًا (أو على الأقل لاحظ إشارتي x وy) وعدّل الزاوية بحيث تشير إلى الربع الصحيح. هذه العادة الواحدة تمنع أكثر الأخطاء شيوعًا في مسائل الإحداثيات القطبية.", "1.5.3 تطبيق: المسافة بين نقطتين على GPS من التطبيقات الحديثة لأنظمة الإحداثيات التي تحملها في جيبك نظام GPS. يعرض كل تطبيق خرائط على الهاتف الموضع كزاويتين، مبيّنتين على الكرة الأرضية في الشكل 1.10: خط العرض φ (درجات شمال خط الاستواء — اتجاه y في الخريطة المحلية) وخط الطول λ (درجات شرق خط غرينتش — اتجاه x). وتعرضهما خرائط Google بالترتيب (خط العرض، خط الطول). ولأن هاتين زاويتان لا طولان، يجب تحويلهما إلى أمتار قبل حساب أي مسافة.", "يأتي التحويل من علاقة طول القوس s = Rθ — الزاوية بالراديان مضروبة في نصف القطر تعطي القوس الذي تقابله — مطبّقةً على الأرض التي يبلغ متوسط نصف قطرها R = 6.371 × 10⁶ m. الدرجة الواحدة تساوي π/180 = 0.0174533 rad، فتقابل درجة واحدة من خط العرض قوسًا طوله s = (6.371 × 10⁶)(0.0174533) ≈ 111,320 m — وهذا أصل القاعدة السهلة الحفظ «1° من خط العرض ≈ 111 km». أما دوائر خطوط الطول فتنكمش مع خط العرض: عند خط العرض φ يكون نصف قطر الدائرة شرق–غرب R cosφ، فلا تساوي درجة واحدة من خط الطول إلا 111,320 × cosφ مترًا. في عُمان (φ ≈ 23°N، cosφ ≈ 0.921) تساوي درجة خط الطول نحو 102.5 km — أي إن درجة خط الطول ودرجة خط العرض لا تمثلان المسافة الفيزيائية نفسها. وللنقطتين اللتين لا تبعدان عن بعضهما إلا بضعة كيلومترات، يمكن معاملة سطح الأرض كخريطة مستوية وتحويل فروق الإحداثيات مباشرة إلى إزاحة محلية (X, Y) (الشكل 1.11): ΔY (شمالًا) = 111,320 × (lat₂ − lat₁) m ، ΔX (شرقًا) = 111,320 × cosφ̄ × (lon₂ − lon₁) m حيث φ̄ متوسط خطي عرض النقطتين (بالدرجات، ويُحوَّل إلى راديان لحساب جيب التمام). ثم تأتي المسافة المستقيمة واتجاهها من نظرية فيثاغورس والظل، تمامًا كما لأي زوج من النقاط في القسم 1.5.1: d = √(ΔX² + ΔY²). وقيمة ΔY السالبة تعني أن النقطة الثانية جنوب الأولى؛ وقيمة ΔX السالبة تعني أنها غربها. (للنقاط المتباعدة مئات الكيلومترات يصبح انحناء الأرض مهمًا وتُستخدم بدلًا من ذلك صيغة هافرساين الأعم — وهي خارج نطاق هذا المقرر، لكنها ما يحسبه تطبيق الخرائط فعليًا للرحلات الطويلة.)"], "1.6": ["1.6.1 تعريفات الكمية القياسية تُحدَّد تمامًا بمقدار (عدد ووحدة) فقط. أما الكمية المتجهة فتتطلب مقدارًا واتجاهًا معًا لتحديدها تحديدًا كاملًا. يعرض الجدول 1.6 أمثلة شائعة على كل منهما.", "كميات قياسية — كميات متجهة", "المسافة — الإزاحة", "السرعة — السرعة المتجهة", "الزمن — القوة", "الكتلة — التسارع", "الحجم — الزخم", "الطاقة — الوزن", "درجة الحرارة — شدة المجال الكهربائي", "التيار الكهربائي — شدة مجال الجاذبية", "الجدول 1.6 أمثلة على الكميات القياسية والمتجهة.", "يوضح الفرق بين المسافة والإزاحة هذا التمييز جيدًا. إذا سجّل عداد سيارة أنها قطعت 10 km في رحلة ذهاب وإياب تعود إلى نقطة البداية، فالمسافة المقطوعة 10 km — كمية قياسية وموجبة دائمًا. أما الإزاحة فهي المتجه المستقيم من نقطة البداية إلى نقطة النهاية؛ ولأن السيارة تعود إلى حيث بدأت، فإزاحتها في الرحلة كاملة صفر، بصرف النظر عن المسافة المقطوعة في الطريق.", "1.6.2 تمثيل المتجهات يُرسم المتجه سهمًا: طول السهم يتناسب مع مقدار المتجه، ورأس السهم يشير إلى اتجاهه. وفي الكتابة يُرمز إلى المتجه بسهم فوق الحرف (A⃗) أو بخط غامق (A)؛ ويُكتب مقداره |A⃗| أو ببساطة A (دون سهم ودون خط غامق).", "1.6.3 تساوي المتجهات والمتجه السالب يتساوى متجهان إذا وفقط إذا كان لهما المقدار نفسه والاتجاه نفسه — أما موضعهما في الفضاء فلا يهم. وهذا يعني أنه يمكن تحريك المتجه بحرية موازيًا لنفسه دون أن يتغير ما يمثله، وهو بالضبط ما يجعل طرق الجمع البياني في القسم 1.7 صحيحة. والمتجه السالب −A⃗ له مقدار A⃗ نفسه لكنه يشير إلى الاتجاه المعاكس. يوضح الشكل 1.3 الفكرتين."], "1.7": ["1.7.1 الطرق البيانية لأن المتجه يمكن تحريكه موازيًا لنفسه دون أن يتغير (القسم 1.6.3)، يمكن جمع متجهين بيانيًا بإحدى طريقتين متكافئتين مبيّنتين في الشكل 1.4. في طريقة المثلث («الرأس إلى الذيل») يوضع ذيل المتجه الثاني عند رأس الأول؛ والمحصلة هي المتجه المرسوم من ذيل المتجه الأول إلى رأس الثاني. وفي طريقة متوازي الأضلاع يُرسم المتجهان من نقطة أصل مشتركة، ويُكمل متوازي الأضلاع الذي يحددانه، وتكون المحصلة هي القطر الخارج من نقطة الأصل المشتركة. وتعطي الطريقتان متجه المحصلة نفسه تمامًا R⃗ = A⃗ + B⃗.", "وتمتد طريقة المثلث بشكل طبيعي إلى أكثر من متجهين: يُرسم كل متجه رأسًا إلى ذيل بالتتابع وبأي ترتيب، والمحصلة هي المتجه الواحد من الذيل الأول إلى الرأس الأخير. والمحصلة النهائية لا تعتمد على ترتيب رسم المتجهات — وهذا تعبير بياني عن خاصيتي التبديل والتجميع المذكورتين في القسم 1.7.5.", "1.7.2 الطريقة التحليلية (طريقة المركّبات) الطرق البيانية مفيدة لبناء الحدس لكنها محدودة الدقة. أما الطريقة التحليلية، أو طريقة المركّبات، فتحلّل كل متجه إلى مركّبتين متعامدتين x وy، وتجمع المركّبات جبريًا، ثم تعيد تركيب المجموعين في محصلة واحدة. لمتجه A⃗ مقداره A واتجاهه بزاوية θ من محور +x (الشكل 1.5):", "Ax = A cos θ ، Ay = A sin θ. ولجمع عدة متجهات A⃗ وB⃗ وC⃗ …، الإجراء هو: 1. حلّل كل متجه إلى مركّبتيه x وy. 2. اجمع كل مركّبات x لتحصل على Rx، واجمع كل مركّبات y لتحصل على Ry. 3. أعد تركيب المجموعين في مقدار المحصلة واتجاهها: R = √(Rx² + Ry²) ، θ = tan⁻¹(Ry / Rx) (مع تعديل الربع كما في القسم 1.5.2).", "1.7.3 طريقة قانون جيوب التمام عندما يُجمع متجهان فقط وتكون الزاوية θ بينهما معلومة مباشرة، كثيرًا ما يكون أسرع تجاوز المركّبات كليًا واستخدام قانون جيوب التمام. وضع المتجهين رأسًا إلى ذيل (الشكل 1.7) يكوّن مثلثًا زاويته المحصورة (180° − θ)؛ وتطبيق قانون جيوب التمام على ذلك المثلث مع استخدام cos(180° − θ) = −cos θ يعطي صيغة «موجبة» مريحة لمقدار المحصلة: R = √(A² + B² + 2AB cos θ) حيث θ الزاوية بين A⃗ وB⃗ مقيسةً وذيلاهما معًا. ويمكن بعدها إيجاد اتجاه R⃗ بقانون الجيوب، أو بالتحليل إلى مركّبات كما في القسم 1.7.2.", "1.7.4 طرح المتجهات يُعرَّف الطرح بدلالة الجمع: A⃗ − B⃗ = A⃗ + (−B⃗). وبيانيًا يعني ذلك عكس اتجاه B⃗ ثم جمعه مع A⃗ بطريقة المثلث أو متوازي الأضلاع. وبصيغة المركّبات تُطرح مركّبات x وy ببساطة.", "1.7.5 خصائص العمليات على المتجهات ● خاصية التبديل: A⃗ + B⃗ = B⃗ + A⃗ ● خاصية التجميع: (A⃗ + B⃗) + C⃗ = A⃗ + (B⃗ + C⃗) ● خاصية التوزيع: k(A⃗ + B⃗) = kA⃗ + kB⃗ لعدد قياسي k ● الضرب في عدد قياسي: ضرب المتجه في عدد قياسي موجب k يغيّر مقداره بمعامل k دون تغيير اتجاهه؛ والضرب في عدد قياسي سالب يعكس اتجاهه أيضًا. ● متجه الوحدة: متجه مقداره 1 يُستخدم للدلالة على الاتجاه فقط. وتُكتب متجهات الوحدة الديكارتية î وĵ وk̂ على امتداد المحاور x وy وz."], "1.8": ["يمكن ضرب متجهين بطريقتين مختلفتين فيزيائيًا: الضرب القياسي (النقطي) الذي يعطي عددًا، والضرب الاتجاهي (التقاطعي) الذي يعطي متجهًا جديدًا عموديًا على المتجهين الأصليين معًا. وأي الطريقتين تنطبق يعتمد كليًا على فيزياء الحالة الموصوفة.", "1.8.1 الضرب القياسي (النقطي) يُعرَّف الضرب القياسي، أو النقطي، لمتجهين A⃗ وB⃗ بينهما زاوية θ كما يلي: A⃗ · B⃗ = AB cos θ. والناتج عدد محض (له وحدة) لا متجه. وهندسيًا، B cos θ هو مسقط B⃗ على اتجاه A⃗ (الشكل 1.8)، فيقيس الضرب النقطي مقدار ما يقع من أحد المتجهين على امتداد اتجاه الآخر.", "وبصيغة المركّبات، لـ A⃗ = (Ax, Ay) وB⃗ = (Bx, By): A⃗ · B⃗ = Ax Bx + Ay By. وهناك حالتان خاصتان تستحقان الحفظ: إذا كان A⃗ وB⃗ في الاتجاه نفسه (θ = 0°) فإن A⃗ · B⃗ = AB، وهي أكبر قيمة ممكنة؛ وإذا كان A⃗ وB⃗ متعامدين (θ = 90°) فإن A⃗ · B⃗ = 0. وتوفر الحالة الثانية اختبارًا سريعًا للتعامد يُستخدم كثيرًا في الفصول اللاحقة. وأهم تطبيق للضرب النقطي في هذا المقرر هو الشغل الميكانيكي: إذا أثّرت قوة ثابتة F⃗ خلال إزاحة d⃗، فالشغل المبذول W = F⃗·d⃗ = Fd cosθ — أي إن مركّبة القوة على امتداد اتجاه الحركة وحدها هي التي تبذل شغلًا. كما أن الضرب النقطي هو الطريقة المعتادة لإيجاد الزاوية بين متجهين عندما يكون كلاهما معلومًا بصيغة المركّبات، كما في المثال أدناه.", "1.8.2 الضرب الاتجاهي (التقاطعي) الضرب الاتجاهي، أو التقاطعي، لـ A⃗ وB⃗ متجه جديد مقداره: |A⃗ × B⃗| = AB sin θ", "واتجاهه عمودي على المستوى الذي يحوي A⃗ وB⃗، ويُحدَّد بقاعدة اليد اليمنى: اثنِ أصابع اليد اليمنى من A⃗ نحو B⃗ (عبر الزاوية الأصغر بينهما)؛ فيشير الإبهام الممدود على امتداد A⃗ × B⃗ (الشكل 1.9).", "وتماثل حالتان خاصتان حالتي الضرب النقطي: إذا كان A⃗ وB⃗ متوازيين (θ = 0° أو 180°) فإن A⃗ × B⃗ = 0 لأن sinθ = 0؛ ويكون الضرب الاتجاهي أكبر ما يكون عندما يتعامد المتجهان (θ = 90°) حيث |A⃗ × B⃗| = AB. وبخلاف الضرب النقطي، الضرب الاتجاهي ليس تبديليًا: عكس الترتيب يعكس الاتجاه، A⃗ × B⃗ = −(B⃗ × A⃗)", "تطبيقات الضرب الاتجاهي التطبيق الأبرز للضرب الاتجاهي في هذا المقرر هو العزم: إذا أثّرت قوة F⃗ عند موضع r⃗ من محور الدوران، فالعزم الذي تنتجه: τ⃗ = r⃗ × F⃗ ، |τ⃗| = r F sin θ حيث θ الزاوية بين r⃗ وF⃗. ولأن sinθ يبلغ أقصاه عند θ = 90°، تنتج قوة معيّنة أكبر أثر دوراني عندما تؤثر عموديًا على ذراع الرافعة — وهذا بالضبط سبب سهولة إدارة مفتاح الربط أو مقبض الباب عند الدفع عموديًا عليه، وضعف الفعالية كثيرًا عند الدفع أو السحب على امتداد طوله. ومن الأمثلة الأخرى التي يصفها الضرب الاتجاهي، والمعروضة هنا تمهيدًا لفصول لاحقة، الزخم الزاوي لجسيم L⃗ = r⃗ × p⃗ (حيث p⃗ الزخم)، والقوة المغناطيسية على شحنة متحركة F⃗ = qv⃗ × B⃗."]}, "examples": {}, "problems": {}};

const INDEX=[];
(function build(){

    for(const s of c.sections){INDEX.push({type:"section",ch:c.num,id:s.num,title:s.title,text:s.paragraphs.join(" ")+" "+(AR.sections[s.num]||"")+" "+((AR.paragraphs||{})[s.num]||[]).join(" "),chTitle:c.short,obj:s})}

    for(const p of c.problems){INDEX.push({type:"problem",ch:c.num,id:c.num+"-"+p.id,title:p.topic+" "+p.id,text:p.text+" "+(AR.topics[p.topic]||"")+" "+((AR.problems||{})[c.num+"-"+p.id]||""),chTitle:c.short,topic:p.topic,pid:p.id})}
    for(const p of c.mc){INDEX.push({type:"mc",ch:c.num,id:c.num+"-"+p.id,title:"Conceptual "+p.id,text:p.text,chTitle:c.short,pid:p.id})}
    c.summary.forEach((s,i)=>INDEX.push({type:"idea",ch:c.num,id:c.num+"-s"+i,title:c.short+" — key idea",text:s,chTitle:c.short}))
  }
  for(const f of FIGS)INDEX.push({type:"figure",ch:Number(f.num.split('.')[0]),id:"fig-"+f.num,title:"Figure "+f.num,text:f.caption,chTitle:"Figure",fig:f})
  for(const [topic,refs] of READ.beyond)INDEX.push({type:"reading",ch:0,id:"r-"+topic,title:topic,text:topic+" "+refs.map(r=>r[2]).join(" "),chTitle:"Further reading",refs})
  for(const f of FORMULAS)INDEX.push({type:"formula",ch:f.ch,id:"f-"+f.name,title:f.name,text:f.expr+" "+f.tags+" "+f.name+" "+(AR.formulas[f.name]||[]).join(" "),chTitle:chOf(f.ch).short,f})
  for(const it of INDEX){it.tk=tok(it.text);it.tt=tok(it.title);it.set=new Set(it.tk.concat(it.tt))}
})();
function expand(q){const w=tok(q);const extra=[];for(const x of w){if(SYN[x])extra.push(...tok(SYN[x]));const bare=x.replace(/^(ال|وال|بال|لل|و|ب|ل)/,"");if(bare!==x&&SYN[bare])extra.push(...tok(SYN[bare]))}return {w,extra}}
function search(q,limit=40){
  const {w,extra}=expand(q); if(!w.length)return[];
  const out=[];
  for(const it of INDEX){
    let sc=0,hits=0;
    for(const x of w){ let h=false; if(it.set.has(x)){sc+=3;h=true} if(it.tt.some(t=>t.startsWith(x))){sc+=4;h=true} if(it.tk.some(t=>t.startsWith(x))){sc+=1;h=true} if(h)hits++ }
    let eh=0;for(const x of extra){ if(it.set.has(x)){sc+=1.5;eh++} }
    if(eh&&hits===0)hits=Math.min(w.length,Math.ceil(eh/1.5));
    if(sc>0){ sc*=Math.pow(hits/w.length,0.7); if(it.type==="formula")sc*=1.35; if(it.type==="example")sc*=1.15; if(it.type==="idea")sc*=1.1; out.push({it,sc}) }
  }
  return out.sort((a,b)=>b.sc-a.sc).slice(0,limit)
}
function snippet(text,q,len=180){
  const {w,extra}=expand(q);const words=w.concat(extra);const lower=text.toLowerCase();let pos=-1;
  for(const x of words){const p=lower.indexOf(x);if(p>=0&&(pos<0||p<pos))pos=p}
  let st=Math.max(0,pos-60);let s=text.slice(st,st+len);if(st>0)s="…"+s;if(st+len<text.length)s+="…";
  let h=esc(s);for(const x of words){if(x.length>2)h=h.replace(new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<span class=hl>$1</span>")}
  return h
}

function langInstr(lang){return lang==="ar"?"Answer entirely in Arabic (Modern Standard, as used in Gulf university physics teaching), keeping equations, symbols and units in Latin/mathematical notation exactly as in the book (e.g. v² = v₀² + 2ax). Standard terms: السرعة المتجهة (velocity), السرعة (speed), التسارع (acceleration), الإزاحة (displacement), الاحتكاك (friction), المستوى المائل (incline), القوة العمودية (normal force), الشد (tension), الشغل (work), طاقة الحركة (kinetic energy), طاقة الوضع (potential energy), القدرة (power), مخطط الجسم الحر (free-body diagram), المقذوف (projectile).":lang==="both"?"Answer in English, then add a heading 'ملخص بالعربية' with a 4–6 line Arabic summary of the key idea and the final result.":"Answer in English."}
async function runAI(id,q,btn){
  const out=document.getElementById(id+"-out");const mode=document.getElementById(id+"-mode").value;const lang=document.getElementById(id+"-lang").value;state.ansLang=lang;
  if(!canAsk()){out.innerHTML=paywallHTML();return}
  const res=search(q,20).filter(r=>!(r.it.ch&&locked(r.it.ch))).slice(0,8);
  const ctx=res.map(({it},i)=>`[${i+1}] (${it.type} · Chapter ${it.ch} · ${it.title})\n${it.text.slice(0,1400)}`).join("\n\n");
  const modeTxt={explain:"Explain the concept clearly for a first-year student, then give one short worked illustration.",steps:"Solve it step by step in the book's style: list Known/Unknown, choose the equation and say why, substitute with units, box the final answer with 3 significant figures, and add a sanity check.",hint:"Do NOT solve it. Give one or two hints that point to the right equation or free-body diagram, then stop.",check:"The student may have included their own reasoning. Check it, identify any error, and explain the correction. Do not just give the answer."}[mode];
  const sys=`You are the physics tutor for this introductory mechanics course, working from the course text by ${AUTHOR}. Use ONLY the passages provided as your source of formulas, notation and method (g = 9.80 m/s², SI units, component method, free-body diagrams). ${modeTxt} When you use a passage, cite it as [n]. If the question is outside the four chapters (Measurement & Vectors, Kinematics, Newton's Laws, Work & Energy) or the passages do not cover it, say so plainly and point to the nearest related section instead of guessing; if a [reading] passage lists a reference textbook chapter, recommend it by name. Keep the answer under 350 words. Use plain text with simple Markdown (**bold**, lists); write equations inline in Unicode like the book. ${langInstr(lang)}`;
  out.innerHTML=`<div class="muted" style="padding:10px 0"><span class="spin"></span> ${t("reading")}</div>`;btn.disabled=true;
  try{
    const text=await callClaude(sys,`Student question: ${q}\n\nPassages from the course text:\n${ctx||"(none matched)"}`);
    useCredit();
    out.innerHTML=`<div class="ai ${lang==="ar"?"rtl":""}">${md(text)}<div class="src ltr">${t("sources")}: ${res.map(({it},i)=>`[${i+1}] ${it.type==="section"?"§"+it.id:it.type==="example"?"Example "+it.id:it.type==="formula"?"formula":"Ch "+it.ch+" "+it.type} — ${esc(it.title)}`).join(" · ")||"none"}</div></div>${canAsk()?"":paywallHTML()}`;
    document.querySelector("#"+id+" .credits").outerHTML=creditLine();
  }catch(e){out.innerHTML=`<div class="note">${t("aiFail",esc(e.message))}</div>`}
  btn.disabled=false;
}
async function callClaude(system,user,extraContent){
  const headers={"Content-Type":"application/json"};
  if(state.apiKey){headers["x-api-key"]=state.apiKey;headers["anthropic-version"]="2023-06-01";headers["anthropic-dangerous-direct-browser-access"]="true"}
  const content=extraContent?[...extraContent,{type:"text",text:user}]:user;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1200,system,messages:[{role:"user",content}]})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  return (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
function md(x){
  let h=esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  const lines=h.split("\n");let out="",inl=null;
  for(const l of lines){
    const m=l.match(/^\s*([-*]|\d+\.)\s+(.*)/);
    if(m){const ty=/\d/.test(m[1])?"ol":"ul";if(inl!==ty){if(inl)out+=`</${inl}>`;out+=`<${ty}>`;inl=ty}out+=`<li>${m[2]}</li>`;continue}
    if(inl){out+=`</${inl}>`;inl=null}
    if(/^#{1,4}\s/.test(l))out+=`<h5>${l.replace(/^#+\s/,"")}</h5>`;else if(l.trim())out+=`<p>${l}</p>`;
  }
  if(inl)out+=`</${inl}>`;return out;
}

  const w=tok(v);let html="";
  for(const c of CONTENT){
    if(locked(c.num)){html+=`<h3>${t("chapter")} ${c.num} — ${esc(chShort(c))}</h3><div class="note">${LOCK} ${t("lk_formulas",PRICE_LABEL)} <a href="#" onclick="event.preventDefault();go('settings')">${t("lk_link")}</a></div>`;continue}
    const rows=FORMULAS.filter(x=>x.ch===c.num&&(!w.length||w.every(q=>(x.name+" "+x.expr+" "+x.tags+" "+(AR.formulas[x.name]||[]).join(" ")).toLowerCase().includes(q))));
    if(!rows.length)continue;
    html+=`<h3>${t("chapter")} ${c.num} — ${esc(chShort(c))}</h3><table><tr><th style="width:26%">${t("fQty")}</th><th>${t("fRel")}</th><th style="width:34%">${t("fWhen")}</th></tr>${rows.map(x=>`<tr style="cursor:pointer" onclick="go('ask','${esc(x.name)}')"><td>${esc(fName(x))}</td><td class="f">${tex(x.expr)}</td><td class="muted">${esc(fNote(x))}</td></tr>`).join("")}</table>`;
  }
  $("#ftab").innerHTML=html||`<div class="empty">${t("noFormula",esc(v))}</div>`;
}
