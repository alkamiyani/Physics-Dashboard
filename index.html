<!DOCTYPE html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --panel:#FFFFFF; --ink:#14213D; --slate:#4B5563; --mist:#9AA3B2; --line:#DDE2E9;
  --teal:#0F766E; --teal-soft:#E3F2F0; --amber:#E9B949; --amber-soft:#FBF3D9; --rose:#B4432F;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arab:"Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif;
  --rail:232px; --aside:280px; --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
[dir=rtl] body{font-family:var(--arab);font-size:16px}
[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .brand b,[dir=rtl] .top h1,[dir=rtl] .chcard b,[dir=rtl] .hero h2,[dir=rtl] .lede{font-family:var(--arab)}
.ltr{direction:ltr;text-align:left}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--ink);color:#DDE3EE;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:flex-start;color:#fff;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .mark{width:34px;height:34px;flex:none;border:1.5px solid #fff;border-radius:4px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:15px}
.brand b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.brand span{font-size:12px;color:#AEB8CA}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;color:#C9D2E0;padding:9px 10px;border-radius:var(--r);font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--ink);font-weight:500}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:10px 8px}
.rail .foot{margin-top:auto;font-size:12px;color:#8C97AB;padding:8px}
.rail .foot b{color:#C9D2E0;font-weight:500}
main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0}
.top .crumb{color:var(--mist);font-size:13px}
.top .spacer{flex:1}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--slate)}
.pill.ok{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.pill.warn{border-color:var(--amber);background:var(--amber-soft);color:#7A5A0B}
.langbtn{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.page{padding:28px 32px 60px;max-width:1120px}
.two{display:grid;grid-template-columns:minmax(0,1fr) var(--aside);gap:28px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}.two aside{display:none}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}.brand{border:0;padding:4px 8px}.nav{flex-direction:row;flex-wrap:wrap;margin:0;width:100%}.nav button{width:auto;padding:6px 10px;font-size:13px;gap:6px}.nav button svg{width:15px;height:15px}.nav .sep,.rail .foot{display:none}.top,.page{padding-left:18px;padding-right:18px}}

h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 6px;line-height:1.25}
h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:22px 0 8px}

.tag.ch1{background:#E8EEF9;color:#2A4A8F}.tag.ch2{background:#E3F2F0;color:#0F766E}.tag.ch3{background:#F5E9E3;color:#A0522D}.tag.ch4{background:#EFEAF7;color:#5B3D9A}

.grid{display:grid;gap:14px}

.muted{color:var(--mist);font-size:13px}

.reading{font-family:var(--serif);font-size:17px;line-height:1.62;max-width:70ch}
.reading p{margin:0 0 14px}
.formula{font-family:var(--serif);font-size:16px;background:#fff;border-inline-start:3px solid var(--teal);padding:8px 12px;margin:6px 0;border-radius:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.ex{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:10px 0;padding:0 16px}
details.ex summary{cursor:pointer;padding:12px 0;font-weight:500;list-style:none;display:flex;gap:10px;align-items:baseline}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary .id{font-family:var(--serif);color:var(--teal);font-weight:600;flex:none}
details.ex .body{padding:0 0 14px;border-top:1px solid var(--line);padding-top:12px}
pre.sol{font-family:var(--serif);font-size:15px;white-space:pre-wrap;line-height:1.55;background:#F8FAFB;border-radius:4px;padding:12px 14px;margin:8px 0 0;border:1px solid var(--line)}
.answer{background:var(--amber-soft);border-inline-start:3px solid var(--amber);padding:8px 12px;border-radius:4px;margin-top:8px;font-family:var(--serif)}
.hl{background:var(--amber-soft);border-radius:2px}
textarea,input[type=text],input[type=password],select{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:#fff;color:var(--ink);width:100%}
.note{font-size:13px;color:var(--slate);background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.ai{background:#fff;border:1px solid var(--line);border-inline-start:3px solid var(--amber);border-radius:var(--r);padding:14px 18px;font-family:var(--serif);font-size:16px;line-height:1.7;direction:ltr;text-align:left}
.ai.rtl{font-family:var(--arab);direction:rtl;text-align:right;font-size:17px}
.ai p{margin:0 0 10px}.ai ul,.ai ol{margin:0 0 10px;padding-inline-start:22px}.ai code{font-family:var(--serif);background:#F4F6F8;padding:0 4px;border-radius:3px}
.ai h5{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--slate);margin:14px 0 6px}
.ai .src{font-family:var(--sans);font-size:12px;color:var(--slate);border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.bar{height:6px;background:#E6EAF0;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:start;font-weight:600;color:var(--slate);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.f{font-family:var(--serif);font-size:15.5px;direction:ltr;text-align:left}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}

.hero{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px 34px 26px;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,#fff 25%,rgba(255,255,255,.35) 100%)}
.hero>*{position:relative}
.hero h2{font-size:30px;max-width:24ch;line-height:1.25}
.hero .sub{color:var(--slate);margin:6px 0 20px;max-width:56ch}
.askbox{display:flex;gap:8px;background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:6px;padding-inline-start:14px;align-items:center;box-shadow:0 8px 24px -14px rgba(20,33,61,.4)}
.askbox input{flex:1;min-width:0;border:0;padding:8px 0;font-size:16px;background:transparent;outline:none}
.askbox .btn{flex:none}
.hero .row{margin-top:14px}

.grid .res{margin:0}
.res{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--teal)}
.res .t{font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res .snip{color:var(--slate);margin-top:4px;font-family:var(--serif);font-size:15px}
.rgroup{margin:18px 0 6px;font-size:12px;font-weight:600;color:var(--slate)}

.chcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;cursor:pointer}
.chcard:hover{border-color:var(--teal)}
.chnum{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;color:var(--teal);width:44px}
.chcard b{font-weight:600;font-family:var(--serif);font-size:17px}
.toc{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;font-size:13.5px}
.toc a{display:block;color:var(--slate);text-decoration:none;padding:5px 8px;border-inline-start:2px solid transparent}
.toc a:hover{color:var(--ink)}
.sec{scroll-margin-top:80px;margin-bottom:32px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head h3{margin:22px 0 8px}
.sec-head .ar{font-size:15px;color:var(--slate);font-family:var(--arab);direction:rtl;font-weight:400}
.done{color:var(--teal);font-size:12px;font-weight:500}
.objectives{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 14px 34px;margin:14px 0 20px;font-family:var(--serif);font-size:15.5px}
.objectives li{margin:4px 0}
.fig{margin:14px 0 18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}.fig img{display:block;max-width:100%;max-height:420px;margin:0 auto}.fig figcaption{font-size:13px;color:var(--slate);margin-top:8px;text-align:center}
.further{font-size:13px;color:var(--slate);background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:6px 18px}.further>span:first-child{font-weight:600;color:var(--ink)}.further i{color:var(--mist)}

.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.q .qt{font-family:var(--serif);font-size:16px;line-height:1.55}
.q .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.q.done{border-inline-start:3px solid var(--teal)}
.opt{display:block;width:100%;text-align:left;direction:ltr;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin:6px 0;font-family:var(--serif);font-size:15px}
.opt:hover{border-color:var(--teal)}.opt.right{background:var(--teal-soft);border-color:var(--teal)}.opt.wrong{background:#FBE9E5;border-color:var(--rose)}
.score{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--teal)}

.drop{border:2px dashed var(--line);border-radius:8px;padding:34px;text-align:center;background:#fff;color:var(--slate)}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.fileitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fileitem b{font-weight:500}
.thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#EEF1F5;border:1px solid var(--line)}
.excerpt{font-family:var(--serif);font-size:14px;color:var(--slate);white-space:pre-wrap;max-height:180px;overflow:auto;background:#F8FAFB;padding:10px;border-radius:4px;border:1px solid var(--line)}

.credits{font-size:12px;color:var(--slate)}
.paywall{background:#fff;border:1px solid var(--amber);border-radius:var(--r);padding:18px 20px;margin-top:10px}
.paywall h5{font-size:16px;margin:0 0 6px;font-family:var(--serif)}
[dir=rtl] .paywall h5{font-family:var(--arab)}
.paywall .price{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);direction:ltr}

.rtl{direction:rtl;text-align:right;font-family:var(--arab)}
pre.sol.rtl{font-family:var(--arab);font-size:16px}
.reading.rtl{font-family:var(--arab);font-size:17.5px;line-height:1.9;max-width:72ch}

.eq{margin:6px 0 8px;overflow-x:auto;padding:2px 0}.sol{font-family:var(--serif);font-size:15px;line-height:1.6;background:#F8FAFB;border-radius:4px;padding:12px 14px;margin:8px 0 0;border:1px solid var(--line)}.sol p{margin:0 0 6px}.sol.rtl p{font-family:var(--arab);font-size:16px}
.sol .katex-display{margin:.3em 0;text-align:left;direction:ltr}.sol.rtl .katex-display{text-align:right}.eqtxt{font-family:var(--serif)}
.katex{font-size:1.08em}.formula .katex{font-size:1.05em}td.f .katex{font-size:1em}
.lock{vertical-align:-2px;color:var(--amber);stroke:#8a6a10}.chnum .lock{width:30px;height:30px}
.lockedcard{opacity:.85;border-style:dashed}.lockedres{opacity:.8;border-style:dashed}
.lk{color:#8a6a10;font-weight:500}.free{color:var(--teal);font-weight:500}

.paybox{border-top:1px solid var(--line);padding-top:6px}.paystep{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}.paystep:last-child{border:0}
.paystep>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.iban{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px;font-family:var(--serif);font-size:17px;letter-spacing:.5px}.ref{font-family:var(--serif);font-weight:600;color:var(--teal)}

.work{margin-top:10px}.work textarea{width:100%;font-family:var(--serif);font-size:15px;line-height:1.6;background:repeating-linear-gradient(#fff,#fff 27px,var(--line) 27px,var(--line) 28px);border:1px solid var(--line);border-radius:4px;padding:6px 10px;resize:vertical}

</style>

<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="brand"><div class="mark">φ</div><div><b id="brandName"></b><span id="brandSub"></span></div></div>
    <div class="nav" id="nav"></div>
    <div class="foot" id="foot"></div>
  </nav>
  <main>
    <div class="top"><h1 id="title"></h1><span class="crumb" id="crumb"></span><span class="spacer"></span><span class="pill" id="creditpill"></span><span class="pill" id="aipill"></span><button class="langbtn" id="langbtn" onclick="setLang(state.lang==='en'?'ar':'en')"></button></div>
    <div class="page" id="page"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================================
   Physics Support Dashboard — bilingual (EN/AR) prototype with a metered AI tutor.
   Instructor settings (edit here before deploying):
   FREE_ANSWERS  – free AI-tutor answers per student before the unlock screen.
   PRICE_LABEL   – shown on the unlock screen.
   PAY_URL       – payment link (Thawani, PayPal, Stripe…). Leave "" to show
                   "pay your instructor and receive an access code" instead.
   UNLOCK_CODES  – hashes of the access codes you hand out after payment.
                   To make a hash: open the browser console (F12) and run  hashCode("YOUR-CODE")
   NOTE: this is client-side metering only. It keeps honest students honest; it
   cannot stop someone who edits the file or clears their progress. Real
   enforcement needs the proxy-server deployment (design document, §7 option C).
   ========================================================================= */
const AUTHOR = "Dr. Salim Saif Al-Kamiyani";
const PAID_MODE = false;       // false = everything free, no payment screens; true = Chapter-lock + metered tutor as configured below
const FREE_ANSWERS = 3;        // free AI-tutor answers before the unlock screen
const FREE_CHAPTERS = [1];     // chapters readable without buying; the rest need the access code
const PRICE_LABEL = "$8";
const PAY_URL = "";                        // optional: an online checkout link (Thawani Pay / PayPal / Stripe). With this set, students pay by card and you can issue codes automatically.
const PAY_IBAN = "OM070270368001648080014";  // bank-transfer IBAN shown to students
const PAY_ACCOUNT_NAME = "";               // account holder name as it appears at the bank (fill in)
const PAY_BANK = "";                       // bank name (fill in)
const PAY_CONTACT_WHATSAPP = "";           // e.g. "968XXXXXXXX" — students send the transfer receipt here to get their code
const PAY_CONTACT_EMAIL = "";              // alternative: an email address for receipts

const CONTENT = [{"num": 1, "title": "Measurement of Physical Quantities and Vectors", "short": "Measurement & Vectors", "objectives": ["Distinguish between physical quantities and units, and between base and derived quantities.", "State the seven SI base units and use SI prefixes correctly.", "Convert measurements between unit systems (SI, CGS, and U.S. customary) using the conversion-factor method.", "Calculate the volume and density of regular solids and convert densities between unit systems.", "Convert a point between rectangular (Cartesian) and polar coordinates, and apply right-triangle trigonometry.", "Distinguish between scalar and vector quantities and identify examples of each.", "Add and subtract vectors graphically (triangle and parallelogram methods) and analytically (components and the Law of Cosines).", "Compute the scalar (dot) product and vector (cross) product of two vectors and apply the right- hand rule.", "Recognize applications of the dot and cross product in mechanics (work, torque, angular momentum)."], "sections": [{"num": "1.1", "title": "Introduction", "paragraphs": ["Physics is, at its core, a science of measurement. Every physical law — from Newton's laws of motion to the equations that describe a graphene sheet's conductivity — is a statement relating quantities that can, in principle, be measured in a laboratory. Before any such relationship can be tested or applied, we need a shared, precise language for expressing “how much,” “how far,” or “in which direction.” That language is the subject of this chapter. This chapter (corresponding to Lectures 1–12 of the course) builds two foundations that will be used throughout the course. The first is measurement itself: what a physical quantity is, how the International System of Units (SI) defines a common set of standards, and how to convert confidently between unit systems. The second is the mathematics of vectors: the tool used to describe any quantity — displacement, velocity, force, torque — that has both a size and a direction. Nearly every topic in mechanics, electricity, and magnetism that follows in this course is built on the ideas introduced here, so the time invested in mastering them now pays off for the rest of the semester."]}, {"num": "1.2", "title": "Physical Quantities and the International System of Units", "paragraphs": ["1.2.1 What Is a Physical Quantity? A physical quantity is any property of an object, substance, or phenomenon that can be measured. Every physical quantity is expressed as a numerical magnitude together with a unit. For example, if the length of a laboratory bench is reported as 1.5 m, the number 1.5 is the magnitude and the meter (m) is the unit. A bare number such as “1.5” is not a physical quantity at all — without a unit we cannot know whether the bench is 1.5 meters, 1.5 feet, or 1.5 kilometers long. Reporting a measurement without its unit is one of the most common — and most easily avoided — errors in an introductory physics course.", "1.2.2 Base and Derived Quantities Physical quantities fall into two classes. Base (fundamental) quantities are defined independently of one another; length, mass, time, electric current, temperature, amount of substance, and luminous intensity are the seven base quantities recognized by the SI. Derived quantities are formed by multiplying or dividing base quantities together — never by adding or subtracting quantities of different kinds. Table 1.1 shows a few familiar derived quantities and how each is built from base quantities.", "Physical Quantity Derived From SI Unit", "Area length × length m²", "Volume length × length × length m³", "Speed length / time m/s", "Density mass / volume kg/m³", "Acceleration length / time² m/s²", "Force mass × acceleration kg·m/s² (newton, N)", "Table 1.1 A few derived quantities and the SI units built from the base units.", "1.2.3 The Seven SI Base Units All other SI units — the newton, the joule, the volt, the pascal — are combinations of the seven base units listed in Table 1.2. Until 20 May 2019, six of the seven base units were tied to physical prototypes or laboratory procedures (most famously the kilogram, defined by a platinum–iridium cylinder kept at the International Bureau of Weights and Measures in France). Following the 2019 revision of the SI, all seven base units are now defined by fixing the exact numerical value of a fundamental constant of nature, so that any properly equipped laboratory anywhere — not just the one holding the original artifact — can realize the unit (NIST, 2019a; BIPM, 2019).", "Quantity Unit (Symbol) Defined by fixing…", "Length meter (m) the speed of light, c = 299,792,458 m/s", "Mass kilogram (kg) the Planck constant, h = 6.62607015 × 10⁻³⁴ J·s", "the Cs-133 hyperfine transition frequency, Δν = Time second (s) 9,192,631,770 Hz", "Electric current ampere (A) the elementary charge, e = 1.602176634 × 10⁻¹⁹ C", "Temperature kelvin (K) the Boltzmann constant, k = 1.380649 × 10⁻²³ J/K", "Amount of substance mole (mol) the Avogadro constant, Nₐ = 6.02214076 × 10²³ mol⁻¹", "Luminous intensity candela (cd) the luminous efficacy, Kcd = 683 lm/W at 540 × 10¹² Hz", "Table 1.2 The seven SI base units and the defining constants that fix their size (NIST, 2019a, 2019b).", "For everyday laboratory work in this course, three of these base units matter most: the meter (length), the kilogram (mass), and the second (time). Because the SI is built from the meter, kilogram, and second, it is often called the MKS system.", "1.2.4 SI Prefixes Measured quantities in physics range from the size of an atomic nucleus (~10⁻¹⁵ m) to the size of the observable universe (~10²⁶ m). Rather than writing long strings of zeros, the SI attaches a prefix to a unit to indicate a power of ten. Table 1.3 lists the prefixes most often used in this course.", "Prefix Symbol Factor Prefix Symbol Factor", "tera T 10¹² centi c 10⁻²", "giga G 10⁹ milli m 10⁻³", "mega M 10⁶ micro μ 10⁻⁶", "kilo k 10³ nano n 10⁻⁹", "hecto h 10² pico p 10⁻¹²", "deci d 10⁻¹ femto f 10⁻¹⁵", "Table 1.3 Common SI prefixes (adapted from NIST SP 330, 2019a)."]}, {"num": "1.3", "title": "Systems of Units and Unit Conversion", "paragraphs": ["1.3.1 Common Unit Systems Three systems of units appear frequently in introductory physics texts. The SI (Système International d'Unités), also called the MKS system, uses the meter, kilogram, and second as its base units for length, mass, and time and is the system used throughout this course. The CGS system uses the centimeter, gram, and second and remains common in some areas of chemistry and electromagnetism. The U.S. customary system uses the foot, slug, and second, where the slug (the U.S. customary unit of mass) is defined so that a 1-lb force gives a 1-slug mass an acceleration of 1 ft/s²; one slug is equivalent to about 14.59 kg.", "1.3.2 Useful Conversion Factors Table 1.4 collects the conversion factors used most often in this course. Each row is an equality — two ways of writing the same physical length, mass, or time interval.", "Length Mass Time", "1 mile = 1609 m = 1.609 km 1 kg = 2.205 lb 1 day = 24 h", "1 ft = 0.3048 m = 30.48 cm 1 oz = 28.35 g 1 h = 60 min = 3600 s", "1 m = 39.37 in = 3.281 ft 1 slug = 14.59 kg 1 day = 86,400 s", "1 in = 0.0254 m = 2.54 cm", "Table 1.4 Conversion factors used throughout the course.", "1.3.3 The Conversion-Factor (Unit-Factor) Method The safest way to convert between units is to multiply the given quantity by one or more conversion factors, each of which is a fraction that equals exactly 1 (because its numerator and denominator represent the same physical amount). Units that appear in both a numerator and a denominator cancel algebraically, leaving only the desired unit behind. Writing out the units at every step — not just the numbers — is the single most effective way to avoid conversion mistakes."]}, {"num": "1.4", "title": "Measuring Volume and Density", "paragraphs": ["1.4.1 Volume of Regular Solids The volume of a regular solid can be found from its linear dimensions, measured with an instrument such as a meter rule or vernier caliper, using the formulas in Table 1.5.", "Regular Solid Volume Formula Variables", "Rectangular block V=l×b×h l = length, b = breadth, h = height", "Regular Solid Volume Formula Variables", "Cylinder V = ¼ π d² h d = diameter, h = height", "Sphere V = ⁴⁄₃ π (d/2)³ d = diameter", "Table 1.5 Volume formulas for common regular solids.", "1.4.2 Density and Its Units The density of a substance is its mass per unit volume, ρ=m/V Because density is a ratio of a mass unit to a volume unit, it is very easy to misplace a factor of 1000 when converting between g/cm³ and kg/m³. The safest approach, as always, is to convert the mass and volume units separately and let them cancel."]}, {"num": "1.5", "title": "Coordinate Systems: Rectangular and Polar", "paragraphs": ["1.5.1 Rectangular (Cartesian) and Polar Coordinates Any point in a plane can be located in more than one way. In the rectangular (Cartesian) system, a point P is specified by its perpendicular distances (x, y) from two fixed, mutually perpendicular axes. In the polar system, the same point is specified instead by a distance r from a fixed origin and an angle θ measured from a fixed reference line, usually the positive x-axis. Figure 1.1 shows both descriptions of the same point.", "The two descriptions are connected by simple trigonometric relations. To go from polar to rectangular coordinates: x = r cos θ , y = r sin θ To go from rectangular to polar coordinates: r = √(x² + y²) , θ = tan⁻¹(y / x)", "1.5.2 Right-Triangle Trigonometry Review The coordinate transformations above are nothing more than the Pythagorean theorem and the basic trigonometric ratios applied to the right triangle formed by x, y, and r. Figure 1.2 reviews these relations for a general right triangle with hypotenuse h, the side opposite angle θ (the “perpendicular,” p), and the side adjacent to θ (the “base,” b).", "The Pythagorean theorem relates all three sides of any right triangle: h² = p² + b²", "Common student error — mind the quadrant A calculator's tan⁻¹ (arctan) function always returns an angle between −90° and +90°, but a point (x, y) can lie in any of the four quadrants. Before trusting the calculator's answer for θ, always sketch the point (or at least note the signs of x and y) and adjust the angle so that it points into the correct quadrant. This single habit prevents the most common mistake in polar-coordinate problems.", "1.5.3 Application: The Distance Between Two GPS Points A modern application of coordinate systems that you carry in your pocket is GPS. Every smartphone map app reports a position as two angles, shown on the globe in Figure 1.10: the latitude φ (degrees north of the equator — the y-direction of a local map) and the longitude λ (degrees east of the Greenwich meridian — the x-direction). Google Maps lists them in the order (latitude, longitude). Because these are angles, not lengths, they must be converted to metres before any distance can be calculated.", "The conversion comes from the arc-length relation s = Rθ — an angle in radians, multiplied by the radius, gives the arc it subtends — applied to the Earth, whose mean radius is R = 6.371 × 10⁶ m. One degree is π/180 = 0.0174533 rad, so one degree of latitude corresponds to an arc of s = (6.371 × 10⁶)(0.0174533) ≈ 111,320 m — the origin of the memorable rule “1° of latitude ≈ 111 km.” Circles of longitude, however, shrink with latitude: at latitude φ the east–west circle has radius R cosφ, so one degree of longitude is only 111,320 × cosφ metres. In Oman (φ ≈ 23°N, cosφ ≈ 0.921) a degree of longitude is about 102.5 km — a degree of longitude and a degree of latitude do NOT represent the same physical distance. For two points that are at most a few kilometres apart, the Earth's surface can be treated as a flat map and the differences in coordinates converted directly to a local (X, Y) displacement (Figure 1.11): ΔY (north) = 111,320 × (lat₂ − lat₁) m , ΔX (east) = 111,320 × cosφ̄ × (lon₂ − lon₁) m where φ̄ is the average latitude of the two points (in degrees, converted to radians for the cosine). The straight-line distance and its direction then follow from the Pythagorean theorem and the tangent, exactly as for any point pair in Section 1.5.1: d = √(ΔX² + ΔY²). A negative ΔY means the second point is south of the first; a negative ΔX means it is west. (For points hundreds of kilometres apart the curvature of the Earth matters and the more general haversine formula is used instead — beyond the scope of this course, but it is what your map app actually computes for long journeys.)"]}, {"num": "1.6", "title": "Scalars and Vectors", "paragraphs": ["1.6.1 Definitions A scalar quantity is completely specified by a magnitude (a number and a unit) alone. A vector quantity requires both a magnitude and a direction to be fully specified. Table 1.6 lists common examples of each.", "Scalar quantities Vector quantities", "Distance Displacement", "Speed Velocity", "Time Force", "Mass Acceleration", "Volume Momentum", "Energy Weight", "Temperature Electric field strength", "Electric current Gravitational field strength", "Table 1.6 Examples of scalar and vector quantities.", "The distinction between distance and displacement illustrates the difference well. If a car's odometer records that it has traveled 10 km on a round trip that returns to the starting point, the distance traveled is 10 km — a scalar, and always positive. The displacement, however, is the straight-line vector from the starting point to the ending point; since the car returns to where it started, its displacement for the round trip is zero, regardless of the distance covered along the way.", "1.6.2 Representing Vectors A vector is drawn as an arrow: the length of the arrow is proportional to the magnitude of the vector, and the arrowhead points in the vector's direction. In print, a vector is denoted with an arrow over a letter ( A⃗ ) or in bold (A); its magnitude is written |A⃗ | or simply A (no arrow, not bold).", "1.6.3 Equality and Negative Vectors Two vectors are equal if and only if they have the same magnitude and the same direction — their location in space does not matter. This means a vector can be moved freely, parallel to itself, without changing what it represents, which is exactly what makes the graphical addition methods of Section 1.7 valid. The negative of a vector, −A⃗ , has the same magnitude as A⃗ but points in the opposite direction. Figure 1.3 illustrates both ideas."]}, {"num": "1.7", "title": "Addition and Subtraction of Vectors", "paragraphs": ["1.7.1 Graphical Methods Because a vector can be moved parallel to itself without changing it (Section 1.6.3), two vectors can be added graphically in either of two equivalent ways, shown in Figure 1.4. In the triangle (“tip-to-tail”) method, the tail of the second vector is placed at the tip of the first; the resultant is the vector drawn from the tail of the first vector to the tip of the second. In the parallelogram method, both vectors are drawn from a common origin, the parallelogram they define is completed, and the resultant is the diagonal from that common origin. Both methods give exactly the same resultant vector R⃗ = A⃗ + B⃗ .", "The triangle method extends naturally to more than two vectors: each vector is drawn tip-to-tail in turn, in any order, and the resultant is the single vector from the starting tail to the final tip. The final resultant does not depend on the order in which the vectors are drawn — a graphical statement of the commutative and associative properties discussed in Section 1.7.5.", "1.7.2 The Analytical (Component) Method Graphical methods are useful for building intuition but are limited in precision. The analytical, or component, method resolves every vector into perpendicular x- and y-components, adds the components algebraically, and then recombines the sums into a single resultant. For a vector A⃗ of magnitude A directed at angle θ from the +x-axis (Figure 1.5):", "Ax = A cos θ , Ay = A sin θ To add several vectors A⃗ , B⃗ , C⃗, …, the procedure is: 1. Resolve every vector into its x- and y-components. 2. Add all the x-components to get Rx, and add all the y-components to get Ry. 3. Recombine the sums into the magnitude and direction of the resultant: R = √(Rx² + Ry²) , θ = tan⁻¹(Ry / Rx) (adjusted for quadrant, as in Section 1.5.2)", "1.7.3 The Law of Cosines Method When only two vectors are added and the angle θ between them is known directly, it is often faster to skip components altogether and use the Law of Cosines. Placing the vectors tip-to-tail (Figure 1.7) forms a triangle whose included angle is (180° − θ); applying the Law of Cosines to that triangle and using cos(180° − θ) = −cos θ gives a convenient “plus” form for the magnitude of the resultant: R = √(A² + B² + 2AB cos θ) where θ is the angle between A⃗ and B⃗ measured with their tails together. The direction of R⃗ can then be found with the Law of Sines, or by resolving into components as in Section 1.7.2.", "1.7.4 Vector Subtraction Subtraction is defined in terms of addition: A⃗ − B⃗ = A⃗ + (−B⃗ ). Graphically, this means reversing the direction of B⃗ and then adding it to A⃗ by the triangle or parallelogram method. In component form, the x- and y- components are simply subtracted.", "1.7.5 Properties of Vector Operations ● Commutative property: A⃗ + B⃗ = B⃗ + A⃗ ● Associative property: (A⃗ + B⃗) + C⃗ = A⃗ + (B⃗ + C⃗) ● Distributive property: k(A⃗ + B⃗) = kA⃗ + kB⃗ for a scalar k ● Scalar multiplication: multiplying a vector by a positive scalar k changes its magnitude by a factor of k without changing its direction; multiplying by a negative scalar also reverses its direction. ● Unit vector: a vector of magnitude 1, used only to indicate direction. The Cartesian unit vectors are written î, ĵ, and k̂ along the x, y, and z axes."]}, {"num": "1.8", "title": "Multiplication of Vectors", "paragraphs": ["Two vectors can be combined by multiplication in two physically distinct ways: the scalar (dot) product, which produces a number, and the vector (cross) product, which produces a new vector perpendicular to both of the originals. Which one applies depends entirely on the physics of the situation being described.", "1.8.1 The Scalar (Dot) Product The scalar, or dot, product of two vectors A⃗ and B⃗ separated by angle θ is defined as: A⃗ · B⃗ = AB cos θ The result is a pure number (with units), not a vector. Geometrically, B cos θ is the projection of B⃗ onto the direction of A⃗ (Figure 1.8), so the dot product measures how much of one vector lies along the direction of the other.", "In component form, for A⃗ = (Ax, Ay) and B⃗ = (Bx, By): A⃗ · B⃗ = Ax Bx + Ay By Two special cases are worth remembering: if A⃗ and B⃗ point in the same direction (θ = 0°), then A⃗ · B⃗ = AB, its maximum possible value; if A⃗ and B⃗ are perpendicular (θ = 90°), then A⃗ ·B⃗ = 0. This second case gives a quick perpendicularity test that is used often in later chapters. The most important application of the dot product in this course is mechanical work: if a constant force F⃗ acts through a displacement d⃗, the work done is W = F⃗·d⃗ = Fd cosθ — only the component of the force along the direction of motion does work. The dot product is also the standard way to find the angle between two vectors when both are known in component form, as in the example below.", "1.8.2 The Vector (Cross) Product The vector, or cross, product of A⃗ and B⃗ is a new vector whose magnitude is: |A⃗ × B⃗| = AB sin θ", "and whose direction is perpendicular to the plane containing A⃗ and B⃗ , given by the right-hand rule: curl the fingers of the right hand from A⃗ toward B⃗ (through the smaller angle between them); the extended thumb then points along A⃗ × B⃗ (Figure 1.9).", "Two special cases mirror those of the dot product: if A⃗ and B⃗ are parallel (θ = 0° or 180°), then A⃗ × B⃗ = 0, since sinθ = 0; the cross product is largest when the vectors are perpendicular (θ = 90°), where | A⃗ × B⃗ | = AB. Unlike the dot product, the cross product is not commutative: reversing the order reverses the direction, A⃗ × B⃗ = −(B⃗ × A⃗)", "Applications of the cross product The headline application of the cross product in this course is torque: if a force F⃗ is applied at a position r⃗ from a pivot, the torque it produces is: τ⃗ = r⃗ × F⃗ , |τ⃗| = r F sin θ where θ is the angle between r⃗ and F⃗. Because sinθ is largest at θ = 90°, a given force produces the greatest turning effect when it is applied perpendicular to the lever arm — which is exactly why a wrench or a door handle is easiest to turn when you push perpendicular to it, and much less effective when you push or pull along its length. Two further examples the cross product describes, previewed here for later chapters, are the angular momentum of a particle, L⃗ = r⃗ × p⃗ (where p⃗ is momentum), and the magnetic force on a moving charge, F⃗ = qv⃗ × B⃗ ."]}], "examples": [{"id": "1.1", "title": "Working with prefixes", "section": "1.2", "problem": "A biology lab reports that a bacterial cell is 1000 μm across. Express this in millimeters and in meters, and decide whether the cell is visible to the unaided eye (the human eye typically resolves details no smaller than about 0.1 mm).", "solution": ""}, {"id": "1.2", "title": "Converting a speed between several unit systems", "section": "1.3", "problem": "A car's speedometer reads 120 km/h. Express this speed in (a) meters per hour, (b) miles per hour, (c) meters per second, and (d) miles per second. Also convert a highway speed of 80 mi/h into meters per second.", "solution": ""}, {"id": "1.3", "title": "A rectangular block's volume", "section": "1.4", "problem": "A rectangular block has length 0.20 m, breadth 12 cm, and height 2 cm. Find its volume in cubic meters.", "solution": ""}, {"id": "1.4", "title": "Converting a density between g/cm³ and kg/m³", "section": "1.4", "problem": "Convert a density of 5.0 g/cm³ to kg/m³.", "solution": ""}, {"id": "1.5", "title": "Volume, density, and mass together", "section": "1.4", "problem": "A block of wood measures 25.0 cm × 15.0 cm × 8.0 cm and has a mass of 1.20 kg. Find (a) its volume in m³, (b) its density in kg/m³, and (c) its density in g/cm³.", "solution": ""}, {"id": "1.6", "title": "Cartesian to polar (first quadrant)", "section": "1.5", "problem": "Convert the Cartesian point (3, 4) to polar coordinates.", "solution": ""}, {"id": "1.7", "title": "Cartesian to polar (third quadrant)", "section": "1.5", "problem": "Convert the Cartesian point (−3.5, −2.5) to polar coordinates.", "solution": ""}, {"id": "1.8", "title": "An application: finding a height by triangulation", "section": "1.5", "problem": "A person stands 46.0 m from the base of a building and shines a flashlight beam toward the top of the building. The beam makes an angle of 39.0° with the horizontal. Find (a) the height of the building and (b) the distance the light travels along the beam.", "solution": ""}, {"id": "1.9", "title": "Distance between two GPS points on campus", "section": "1.5", "problem": "Google Maps gives two nearby locations as P₁ = (22.9246221°, 57.5310830°) and P₂ = (22.9235077°, 57.5309617°), in the order (latitude, longitude). Taking P₁ as the origin with X east and Y north, find (a) the (X, Y) position of P₂ in metres and (b) the straight-line distance between the points.", "solution": ""}, {"id": "1.10", "title": "Adding two vectors given in component form", "section": "1.7", "problem": "Vector A⃗ has components (2, 3) and vector B⃗ has components (3, −4). Find (a) the magnitude and direction of A⃗ , (b) the magnitude and direction of B⃗ , and (c) the magnitude and direction of the resultant C⃗ = A⃗ + B⃗ .", "solution": ""}, {"id": "1.11", "title": "A displacement problem (angles given, not components)", "section": "1.7", "problem": "A hiker walks 53.0 m in a direction 20.0° north of east, then 34.0 m in a direction 63.0° north of east. Find the hiker's resultant displacement.", "solution": ""}, {"id": "1.12", "title": "Adding two vectors with the Law of Cosines", "section": "1.7", "problem": "A hiker walks 5.0 km due west, then 7.0 km in a direction 40° north of that westward line. Find the magnitude and direction of the resultant displacement.", "solution": ""}, {"id": "1.13", "title": "Subtracting two vectors", "section": "1.7", "problem": "Using the same vectors as Example 1.10, A⃗ = (2, 3) and B⃗ = (3, −4), find D⃗ = A⃗ − B⃗ .", "solution": ""}, {"id": "1.14", "title": "Adding three vectors (an Omani road trip)", "section": "1.7", "problem": "A group drives at a compass heading 27° west of south for 18 km to reach the Oman Across Ages Museum, then directly south for 17 km to a historical fort, then at a compass heading 13° north of east for 48 km to a traditional souq. Find the total displacement for the trip.", "solution": ""}, {"id": "1.15", "title": "Finding the angle between two vectors", "section": "1.8", "problem": "Find the angle between A⃗ = (2, 3) and B⃗ = (3, −4) (the same vectors used in Example 1.10).", "solution": ""}, {"id": "1.16", "title": "Torque from a wrench", "section": "1.8", "problem": "A mechanic applies a force of 40 N to the end of a wrench of length 0.25 m. Find the torque produced (a) when the force is perpendicular to the wrench handle, and (b) when the force is applied at 30° to the handle. (c) At what angle is the torque largest, and why does this match everyday experience with wrenches and door handles?", "solution": ""}], "summary": ["A physical quantity is a magnitude together with a unit; base quantities (length, mass, time, current, temperature, amount of substance, luminous intensity) are independent, and all other quantities are derived from them.", "Since 2019, all seven SI base units are defined by fixing the value of a fundamental physical constant rather than by a physical artifact.", "Unit conversions are performed safely with conversion factors — fractions equal to 1 — chosen so that unwanted units cancel.", "Volumes of regular solids follow V = lbh (block), V = ¼πd²h (cylinder), and V = ⁴⁄₃π(d/2)³ (sphere); density is ρ = m/V.", "A point can be described in rectangular coordinates (x, y) or polar coordinates (r, θ), related by x = r cosθ, y = r sinθ, r = √(x²+y²), and θ = tan⁻¹(y/x) — always checked against the quadrant of (x, y).", "GPS coordinates are angles, converted to local map distances by ΔY = 111,320 × Δlat and ΔX = 111,320 × cosφ̄ × Δlon (in metres, Δlat and Δlon in degrees); the distance between two nearby points is then d = √(ΔX² + ΔY²).", "Scalars have magnitude only; vectors have magnitude and direction. Vectors are added graphically (triangle or parallelogram method) or analytically (components, or the Law of Cosines when only two vectors and the angle between them are involved).", "The component method: Rx = ΣAx, Ry = ΣAy, then R = √(Rx²+Ry²) and θ = tan⁻¹(Ry/Rx).", "The Law of Cosines method: R = √(A²+B²+2AB cosθ), where θ is the angle between the two vectors.", "The dot product A⃗ ·B⃗ = AB cosθ = AxBx+AyBy is a scalar; it is zero for perpendicular vectors and is the basis of the definition of work, W = F⃗·d⃗.", "The cross product A⃗ ×B⃗ has magnitude AB sinθ and direction given by the right-hand rule; it is zero for parallel vectors and is the basis of the definition of torque, τ⃗ = r⃗×F⃗."], "problems": [{"id": "A1", "topic": "Units, Measurement, and Conversion", "text": "Convert 250 cm to (a) meters, (b) inches, and (c) feet.", "answer": "(a) 2.50 m (b) 98.4 in (c) 8.20 ft"}, {"id": "A2", "topic": "Units, Measurement, and Conversion", "text": "A car travels at 95 km/h. Express this speed in (a) m/s and (b) mi/h.", "answer": "(a) 26.4 m/s (b) 59.0 mi/h"}, {"id": "A3", "topic": "Units, Measurement, and Conversion", "text": "The density of aluminum is 2.70 g/cm³. Express this density in kg/m³.", "answer": "2700 kg/m³"}, {"id": "A4", "topic": "Units, Measurement, and Conversion", "text": "A container measures 40.0 cm × 20.0 cm × 12.0 cm and holds air of density 1.20 kg/m³. Find (a) the container's volume in m³, (b) the density of the air in kg/cm³, (c) the container's volume in cubic feet (1 ft = 30.48 cm), and (d) the mass of air inside the container, in pounds (1 lb = 0.454 kg).", "answer": "(a) 9.60 × 10⁻³ m³ (b) 1.20 × 10⁻⁶ kg/cm³ (c) 0.339 ft³ (d) 0.0254 lb"}, {"id": "A5", "topic": "Units, Measurement, and Conversion", "text": "A sphere has a diameter of 8.0 cm. Calculate its volume in cm³ and in m³.", "answer": "268 cm³ = 2.68 × 10⁻⁴ m³"}, {"id": "A6", "topic": "Units, Measurement, and Conversion", "text": "Using SI prefixes, express (a) 4,500,000 Hz in MHz, (b) 0.000082 s in μs, and (c) 3.2 × 10⁹ W in GW.", "answer": "(a) 4.5 MHz (b) 82 μs (c) 3.2 GW"}, {"id": "B1", "topic": "Coordinate Systems and Trigonometry", "text": "Convert the Cartesian point (6, 8) to polar coordinates.", "answer": "(10.0, 53.1°)"}, {"id": "B2", "topic": "Coordinate Systems and Trigonometry", "text": "Convert the Cartesian point (−4, 3) to polar coordinates.", "answer": "(5.00, 143.1°)"}, {"id": "B3", "topic": "Coordinate Systems and Trigonometry", "text": "A point has polar coordinates (10, 210°). Find its Cartesian (x, y) coordinates.", "answer": "(−8.66, −5.00)"}, {"id": "B4", "topic": "Coordinate Systems and Trigonometry", "text": "A surveyor stands 60.0 m from the base of a tower and measures the angle of elevation to the top of the tower as 42.0°. Find the height of the tower.", "answer": "54.0 m"}, {"id": "B5", "topic": "Coordinate Systems and Trigonometry", "text": "Google Maps gives two points in Muscat as P₁ = (23.6100000°, 58.5400000°) and P₂ = (23.6127000°, 58.5445000°), in the order (latitude, longitude). Taking P₁ as the origin with X east and Y north, find (a) the (X, Y) position of P₂ in metres, (b) the straight-line distance between the points, and (c) the direction of P₂ from P₁ (use cos 23.61° = 0.916).", "answer": "(a) (459 m, 301 m) (b) 549 m (c) 33.2° north of east"}, {"id": "C1", "topic": "Scalars and Vectors: Concepts", "text": "Classify each of the following as a scalar or a vector: mass, weight, velocity, kinetic energy, momentum, electric charge, torque, pressure.", "answer": "Scalars: mass, kinetic energy, electric charge, pressure. Vectors: weight, velocity, momentum, torque."}, {"id": "C2", "topic": "Scalars and Vectors: Concepts", "text": "Two cars each travel around the same 10-km circular racetrack and return to their starting points. Explain why their displacements are both zero even though the distance each car traveled is not.", "answer": ""}, {"id": "C3", "topic": "Scalars and Vectors: Concepts", "text": "Vectors A⃗ and B⃗ are perpendicular, with magnitudes 6 and 8, respectively. Sketch the situation and find the magnitude of their resultant C⃗ = A⃗ + B⃗ .", "answer": "|C⃗ | = √(6²+8²) = 10"}, {"id": "D1", "topic": "Vector Addition and Subtraction", "text": "Vector A⃗ has magnitude 8.0 units directed along +x, and vector B⃗ has magnitude 6.0 units directed along +y. Find the magnitude and direction of (a) A⃗ + B⃗ and (b) A⃗ − B⃗ .", "answer": "(a) magnitude 10.0, 36.9° above +x (b) magnitude 10.0, 36.9° below +x"}, {"id": "D2", "topic": "Vector Addition and Subtraction", "text": "Given A⃗ = (4, −2) and B⃗ = (−1, 5), find (a) A⃗ + B⃗ , (b) A⃗ − B⃗ , and (c) the magnitude and direction of A⃗ , B⃗ , A⃗ +B⃗ , and A⃗ −B⃗ .", "answer": "(a) (3, 3), magnitude 4.24 at 45.0° (b) (5, −7), magnitude 8.60 at −54.5° (c) | A⃗ | = 4.47 at −26.6°; | B⃗ | = 5.10 at 101.3°"}, {"id": "D3", "topic": "Vector Addition and Subtraction", "text": "A boat heads 30.0° east of north for 4.0 km, then due east for 3.0 km. Use the component method to find the resultant displacement.", "answer": "6.08 km at 34.7° north of east"}, {"id": "D4", "topic": "Vector Addition and Subtraction", "text": "Two forces act on a bolt: F⃗₁ = 20.0 N directed along +x, and F⃗₂ = 15.0 N directed at 110° from +x. Use the Law of Cosines to find the magnitude of the resultant force.", "answer": "20.5 N"}, {"id": "D5", "topic": "Vector Addition and Subtraction", "text": "A hiker walks 6.0 km due east, then 9.0 km in a direction 35° north of east. Find the resultant displacement using (a) the component method and (b) the Law of Cosines, and confirm that the two methods agree.", "answer": "14.3 km at 21.1° north of east (both methods agree)"}, {"id": "E1", "topic": "Products of Vectors", "text": "Find A⃗ ·B⃗ for A⃗ = (5, 2) and B⃗ = (−3, 4). What is the angle between A⃗ and B⃗ ?", "answer": "A⃗ ·B⃗ = −7; θ = 105.1°"}, {"id": "E2", "topic": "Products of Vectors", "text": "Two vectors have magnitudes 6.0 and 9.0 units, with an angle of 50° between them. Find (a) their dot product and (b) the magnitude of their cross product.", "answer": "(a) 34.7 (b) 41.4"}, {"id": "E3", "topic": "Products of Vectors", "text": "A force of 25 N is applied at the end of a 0.40 m wrench at an angle of 60° to the handle. Find the magnitude of the torque produced. If the force tends to rotate the wrench counterclockwise as viewed from above, in which direction does the torque vector point?", "answer": "8.66 N·m, directed out of the page (toward the viewer)"}, {"id": "E4", "topic": "Products of Vectors", "text": "A particle has position vector r⃗ = (3, 4, 0) m and momentum p⃗ = (0, 0, 6) kg·m/s. Using the component rule for the cross product, find its angular momentum L⃗ = r⃗ × p⃗. (This previews a topic from a later chapter — for now, just apply the method.)", "answer": "L⃗ = (24, −18, 0) kg·m²/s, magnitude 30 kg·m²/s Conceptual Review"}], "mc": [{"id": "MC1", "topic": "Conceptual Review", "text": "Two vectors of unequal magnitude are added together. Which of the following resultant magnitudes is impossible? (a) the sum of the two magnitudes (b) the difference of the two magnitudes (c) zero (d) a value between the sum and the difference", "answer": "(c)"}, {"id": "MC2", "topic": "Conceptual Review", "text": "Which pair of physical quantities below are both scalars? (a) force and velocity (b) work and speed (c) displacement and torque (d) mass and momentum", "answer": "(b)"}, {"id": "MC3", "topic": "Conceptual Review", "text": "A car completes a round trip in a finite time. Its average speed for the trip (a) is always zero (b) can never be zero (c) always equals its average velocity (d) depends only on its displacement", "answer": "(b)"}, {"id": "MC4", "topic": "Conceptual Review", "text": "Take east as +x, north as +y, and up as +z (a right-handed system). If A⃗ points north and B⃗ points east, in which direction does A⃗ × B⃗ point? (a) up (b) down (c) north-east (d) west", "answer": "(b)"}, {"id": "MC5", "topic": "Conceptual Review", "text": "For which pair of vectors can the magnitude of the resultant A⃗ + B⃗ equal the difference of their individual magnitudes, |A − B|? (a) parallel vectors (b) perpendicular vectors (c) antiparallel (oppositely directed) vectors (d) vectors at 45° to each other", "answer": "(c)"}]}, {"num": 2, "title": "Kinematics: Motion in One and Two Dimensions", "short": "Kinematics", "objectives": ["Define kinematics and distinguish between distance and displacement, and between speed and velocity.", "Calculate average velocity, average speed, and acceleration from position and time data.", "Interpret position–time and velocity–time graphs: read velocity from the slope of an x–t graph, and acceleration and displacement from a v–t graph.", "Apply the four equations of motion for constant acceleration to solve one-dimensional problems.", "Analyze free-fall motion (objects dropped, thrown downward, or thrown upward) using a consistent sign convention.", "Resolve projectile motion into independent horizontal and vertical components and calculate time of flight, maximum height, and range."], "sections": [{"num": "2.1", "title": "Introduction: What Is Kinematics?", "paragraphs": ["Kinematics is the branch of mechanics that describes how objects move — their position, velocity, and acceleration as functions of time — without asking what causes the motion. The question of why objects move (forces) is the subject of dynamics, which begins in Chapter 3. An object that moves along a straight- line path, such as a car on a straight road or a ball dropped from a window, is said to undergo one- dimensional translational motion; this chapter begins there and then extends the same ideas to the two- dimensional motion of projectiles. The chapter builds directly on Chapter 1. Displacement, velocity, and acceleration are all vectors, and the component method of Section 1.7 is exactly what allows projectile motion to be split into two simpler, independent one-dimensional problems. The primary textbook reference for this chapter is Giancoli, Physics: Principles with Applications, Chapters 2 and 3 (Giancoli, 2014), of which copies are available in the ASU Learning Resources Center."]}, {"num": "2.2", "title": "Position, Distance, and Displacement", "paragraphs": ["To describe motion we first choose a reference point (the origin) and a positive direction; the position x of an object is then its coordinate along that axis. The displacement is the change in position between an initial point and a final point: Δx = xf − xi", "Displacement is a vector: its sign (in one dimension) or direction (in two dimensions) matters, and its SI unit is the meter. Equivalently, it is the straight-line distance from the starting point to the ending point, together with the direction. The distance traveled, by contrast, is the total length of the path actually followed, and is a scalar that can never be negative. The two coincide only when an object moves in one direction without reversing; whenever the object turns around, the distance is larger than the magnitude of the displacement. In the extreme case of a round trip, the displacement is zero while the distance is not."]}, {"num": "2.3", "title": "Velocity and Speed", "paragraphs": ["2.3.1 Average Velocity The average velocity over a time interval is the displacement divided by the elapsed time: v̄ = Δx/Δt = (xf − xi)/(tf − ti) It is a vector with SI unit m/s, and its direction is always that of the displacement. A negative average velocity in one dimension simply means the object's net motion was in the negative direction.", "2.3.2 Instantaneous Velocity Average velocity says nothing about how the motion varied within the interval. The velocity at a single instant — what a speedometer reads — is the instantaneous velocity, defined as the average velocity over a vanishingly short interval: v = lim (Δt→0) Δx/Δt = dx/dt Graphically, this is the slope of the position–time graph at that instant (Section 2.5). When an object moves with constant velocity, its velocity never changes, so the instantaneous velocity and the average velocity are equal — this is the only situation in which the two must coincide.", "2.3.3 Speed and Average Speed Speed is the rate at which distance is covered; it is a scalar (SI unit m/s) and is always non-negative. The average speed is the total distance traveled divided by the total time: average speed = total distance/total time Because distance and displacement differ whenever a path bends or reverses, average speed and the magnitude of average velocity generally differ too. Several cars driving from the same start point to the same end point by different routes all have the same average velocity (same displacement, same time), but the cars on the longer, winding routes have greater average speeds because they covered more distance in that time."]}, {"num": "2.4", "title": "Acceleration", "paragraphs": ["Acceleration is the time rate of change of velocity. The average acceleration over an interval is ā = Δv/Δt = (vf − vi)/(tf − ti)", "with SI unit m/s². Acceleration is a vector. When the acceleration is constant (uniform acceleration), the velocity changes by equal amounts in equal time intervals, and the average velocity over any interval is simply the mean of the initial and final velocities: v̄ = (v0 + v)/2 (constant acceleration only) Three special cases are worth naming. Uniform motion means the velocity is constant, so the acceleration is zero. Uniform acceleration means the acceleration is constant (though the velocity is not). Deceleration is the everyday word for an object slowing down; in physics it means that the velocity and the acceleration point in opposite directions — note that a negative acceleration is not automatically a deceleration, since an object moving in the negative direction with negative acceleration is speeding up."]}, {"num": "2.5", "title": "Graphs of Motion", "paragraphs": ["Graphs of position, velocity, and acceleration against time are among the most useful tools in kinematics because each graph's geometry carries physical meaning: ● Position–time (x–t) graph: the slope at any point equals the velocity. A straight line means constant velocity; a horizontal line means the object is at rest; a curve means the velocity is changing. ● Velocity–time (v–t) graph: the slope equals the acceleration, and the area between the graph and the time axis equals the displacement. A straight line means constant acceleration; a horizontal line means constant velocity. ● Acceleration–time (a–t) graph: the area under the graph equals the change in velocity. Figure 2.1 shows the three graphs side by side for an object at rest, one moving with uniform velocity, and one moving with uniform acceleration."]}, {"num": "2.6", "title": "Equations of Motion for Constant Acceleration", "paragraphs": ["When the acceleration is constant, the definitions of velocity and acceleration can be combined into four equations that relate the five quantities x (displacement, measured from x₀ = 0), v₀ (initial velocity), v (final velocity), a (acceleration), and t (time). Each equation omits exactly one of the five, which is the key to choosing the right one for a given problem.", "No. Equation Quantity not involved Where it comes from", "1 v = v0 + at x definition of acceleration", "displacement = average 2 x = ½(v0 + v) t a velocity × time", "No. Equation Quantity not involved Where it comes from", "3 x = v0 t + ½ a t² v substitute (1) into (2)", "eliminate t between (1) 4 v² = v0² + 2 a x t and (2)", "Table 2.1 The four equations of motion for constant acceleration.", "Equation 2 is also the statement that displacement equals the area under a v–t graph (a trapezoid, for constant acceleration). Equation 3 shows that the x–t graph for uniform acceleration is a parabola, and Equation 1 that the v–t graph is a straight line of slope a — exactly the shapes in the bottom row of Figure 2.1.", "Problem-solving strategy for constant acceleration 1. Draw a sketch, choose an origin and a positive direction, and stick to that sign convention throughout. 2. List the known quantities and the unknown, converting all units to SI (in particular, km/h to m/s). 3. Identify which of the five quantities is neither given nor wanted, and choose the equation in Table 2.1 that omits it. 4. Solve algebraically first, then substitute numbers. Check that the sign and magnitude of the answer make physical sense."]}, {"num": "2.7", "title": "Free Fall", "paragraphs": ["2.7.1 Acceleration Due to Gravity An object moving under the influence of gravity alone — with air resistance negligible — is said to be in free fall. Near the Earth's surface every freely falling object, regardless of its mass, experiences the same constant downward acceleration, called the acceleration due to gravity: g = 9.80 m/s² (directed toward the Earth's centre) Because g is constant, free fall is simply a special case of uniformly accelerated motion, and the four equations of Table 2.1 apply directly. The only new ingredient is a consistent sign convention. Throughout this chapter we take upward as positive, so the acceleration is a = −g = −9.80 m/s² at every instant of the motion — while the object rises, at the highest point, and while it falls. With this choice, and with the vertical coordinate written as y, the equations of motion become:", "v = v0 − gt , Δy = v0 t − ½ g t² , v² = v0² − 2g Δy", "2.7.2 Three Cases of Free Fall ● An object dropped: the initial velocity is zero; the object speeds up as it falls, with velocity becoming more and more negative. ● An object thrown downward: the initial velocity is negative (downward) and the object continues to speed up. ● An object thrown upward: the initial velocity is positive; the object slows, momentarily stops at its highest point (v = 0, but a is still −g), then falls back. The motion is symmetric about the highest point: the time to rise equals the time to fall back to the launch height, and the object returns to the launch height with a velocity equal and opposite to its launch velocity, v = −v₀.", "Common student error — “the acceleration is zero at the top” At the highest point of a throw the velocity is momentarily zero, but the acceleration is not: it is −g both just before and just after that instant, and it is exactly this unchanging downward acceleration that makes the velocity pass through zero and reverse. If the acceleration were zero at the top, the object would hover there. Keep a = −g throughout every free-fall calculation."]}, {"num": "2.8", "title": "Projectile Motion", "paragraphs": ["2.8.1 Independence of Horizontal and Vertical Motion A projectile is any object launched into the air on which the only force acting is gravity (air resistance being neglected). A thrown ball, a kicked football, and a cannon shell are all projectiles once they leave the launcher. The key insight, first appreciated by Galileo, is that the horizontal and vertical motions are completely independent: the horizontal motion has zero acceleration, so the horizontal velocity stays constant, while the vertical motion is ordinary free fall with a = −g. Gravity has no effect on horizontal motion, and horizontal motion has no effect on the fall. The combined path is a parabola (Figure 2.5).", "For a projectile launched from the origin with speed v₀ at angle θ above the horizontal, the initial velocity is resolved into components exactly as in Section 1.7: v0x = v0 cos θ , v0y = v0 sin θ The horizontal and vertical motions are then described by separate sets of equations:", "Horizontal (ax = 0) Vertical (ay = −g)", "vx = v0x (constant) vy = v0y − gt", "x = v0x t y = v0y t − ½ g t²", "vy² = v0y² − 2g y", "Table 2.2 Equations of projectile motion (launch point at the origin, upward positive).", "At any instant the speed is v = √(vx² + vy²) and the direction of motion is at angle tan⁻¹(vy/vx) to the horizontal. The two motions are linked only through the common time t — which is why most projectile problems are solved by finding a time from one component and then using it in the other.", "2.8.2 Time of Flight, Maximum Height, and Range For a projectile that lands at the same height from which it was launched, three results follow directly from the vertical equations. At the highest point vy = 0, which gives the time to reach the peak; by symmetry the total time of flight is twice that: tup = v0 sin θ/g , T = 2 v0 sin θ/g The maximum height follows from vy² = v₀ᵧ² − 2gH with vy = 0:", "H = v0² sin²θ/(2g) The horizontal range R is the horizontal distance covered during the flight time T: R = v0x T = 2 v0² sin θ cos θ/g = v0² sin 2θ/g Since sin 2θ is greatest at 2θ = 90°, the range on level ground is a maximum for a launch angle of 45°, and two angles that add to 90° (for example 30° and 60°) give the same range. These formulas apply only when the landing height equals the launch height; for a projectile launched from a roof or cliff, go back to the equations in Table 2.2 and solve for the time from the vertical equation, as in Example 2.20."]}], "examples": [{"id": "2.1", "title": "Distance and displacement on a straight road", "section": "2.2", "problem": "A car travels 100 m east along a straight road, then 50 m west. Find the distance traveled and the displacement.", "solution": ""}, {"id": "2.2", "title": "Displacement in two dimensions", "section": "2.2", "problem": "A person walks 4 m east and then 3 m north. Find the distance traveled and the displacement.", "solution": ""}, {"id": "2.3", "title": "A round trip on a track", "section": "2.2", "problem": "A runner completes two laps of a rectangular track 50 m long and 20 m wide, finishing at the starting point. Find the distance traveled and the displacement.", "solution": ""}, {"id": "2.4", "title": "Average velocity from two positions", "section": "2.3", "problem": "At t = 5 s a car is 10 m from a reference point; at t = 10 s it is 40 m from the same point (in the same direction). Find its average velocity.", "solution": ""}, {"id": "2.5", "title": "A swimmer's round trip", "section": "2.3", "problem": "A swimmer covers the 50 m length of a pool in 20 s, then returns to the starting wall in 22 s. Find the average velocity for (a) the first length, (b) the return length, (c) the round trip, and (d) the average speed for the round trip.", "solution": ""}, {"id": "2.6", "title": "Reading acceleration and displacement from a v–t graph", "section": "2.5", "problem": "The velocity of an object is shown in Figure 2.2: it rises from 0 to 4 m/s in the first 2 s, stays at 4 m/s until t = 6 s, then falls uniformly to 0 at t = 10 s. Find (a) the acceleration in each of the three intervals, and the distance moved in the first (b) 2 s, (c) 6 s, and (d) 10 s.", "solution": ""}, {"id": "2.7", "title": "A v–t graph with a change of direction", "section": "2.5", "problem": "Figure 2.3 shows the velocity of an object in meters per minute. Find (a) the acceleration from 0 to 10 min, (b) from 30 to 40 min, (c) from 40 to 55 min, and (d) the distance and (e) the displacement between 15 and 40 min.", "solution": ""}, {"id": "2.8", "title": "A race car (time known, displacement unknown)", "section": "2.6", "problem": "A race car accelerates uniformly from 18.5 m/s to 46.1 m/s in 2.47 s. Find its acceleration and the distance it travels.", "solution": ""}, {"id": "2.9", "title": "A bicycle (distance known, time unknown)", "section": "2.6", "problem": "A bicycle accelerates uniformly from rest to 7.10 m/s over a distance of 35.4 m. Find its acceleration.", "solution": ""}, {"id": "2.10", "title": "A car from rest (time and distance known)", "section": "2.6", "problem": "A car starts from rest and accelerates uniformly for 5.21 s, covering 110 m. Find the acceleration and the final velocity.", "solution": ""}, {"id": "2.11", "title": "Speeding up, then braking (a two-stage problem)", "section": "2.6", "problem": "A car moving at 18 km/h accelerates at 1.5 m/s² for 10 s. (a) Find its speed and displacement at the end of the 10 s. (b) The driver then brakes and the car comes to rest in a further 15 s. Find the total displacement.", "solution": ""}, {"id": "2.12", "title": "Speed after a given distance", "section": "2.6", "problem": "A racing car starts from rest and accelerates at a constant 5.0 m/s². What is its speed after it has covered 30.5 m?", "solution": ""}, {"id": "2.13", "title": "A dropped feather on the Moon", "section": "2.7", "problem": "A feather is dropped from a height of 1.40 m on the Moon, where the acceleration due to gravity is 1.67 m/s². How long does it take to reach the surface?", "solution": ""}, {"id": "2.14", "title": "A ball thrown straight up", "section": "2.7", "problem": "A ball is thrown vertically upward at 20.0 m/s. Find (a) the maximum height, (b) the time to reach it, (c) the velocity and position at t = 1.00 s and t = 3.00 s, and (d) the time at which the ball returns to the launch height.", "solution": ""}, {"id": "2.15", "title": "A faster throw", "section": "2.7", "problem": "A ball is thrown upward at 40.0 m/s. Find (a) its velocity at the highest point, (b) its velocity after 3.00 s in the air, (c) the time to reach maximum height, and (d) its acceleration.", "solution": ""}, {"id": "2.16", "title": "Rise, fall, and return", "section": "2.7", "problem": "A ball is thrown vertically upward at 25.0 m/s. (a) How high does it rise? (b) How long does it take to reach its highest point? (c) How long after that does it return to the launch level? (d) What is its velocity when it returns to the launch level?", "solution": ""}, {"id": "2.17", "title": "Thrown upward from the top of a building", "section": "2.7", "problem": "An object is thrown vertically upward at 20.0 m/s from the top of a building and reaches the ground 5.00 s later. Find (1) the maximum height above the ground, (2) the height of the building, (3) the total distance traveled, and (4) the speed on reaching the ground.", "solution": ""}, {"id": "2.18", "title": "Components and maximum height at three launch angles", "section": "2.8", "problem": "An object is launched at 20.0 m/s at (a) 30°, (b) 60°, and (c) 90° above the horizontal. For each case find the components of the initial velocity and the maximum height reached.", "solution": ""}, {"id": "2.19", "title": "A long-range projectile", "section": "2.8", "problem": "A projectile is fired at 400 m/s at 30° above level ground. Ignoring air resistance, find (1) the time to reach maximum height, (2) the total time of flight, (3) the horizontal range, and (4) the maximum height.", "solution": ""}, {"id": "2.20", "title": "Launched from a roof (landing below the launch height)", "section": "2.8", "problem": "A ball is thrown at 21.0 m/s at 30° above the horizontal from the top of a 16.0 m building. Find (1) the maximum height above the ground, (2) the time of flight, (3) the horizontal range, (4) the speed on hitting the ground, and (5) the velocity when the ball is 2.00 m above the roof.", "solution": ""}, {"id": "2.21", "title": "A field-goal kick", "section": "2.8", "problem": "A football is kicked at 30.0 m/s at 30° above the ground. The crossbar is 3.00 m high. From how far away can the ball just clear the crossbar?", "solution": ""}], "summary": ["Displacement Δx = xf − xi is a vector (the straight-line change in position); distance is the scalar length of the path. They agree only for motion in one direction without reversal.", "Average velocity v̄ = Δx/Δt is a vector; average speed = total distance/total time is a scalar. For a round trip the average velocity is zero but the average speed is not.", "Instantaneous velocity is the slope of the x–t graph. Acceleration a = Δv/Δt is the slope of the v–t graph, and the area under a v–t graph is the displacement (areas below the axis count as negative).", "For constant acceleration: v = v0 + at ; x = ½(v0 + v)t ; x = v0 t + ½at² ; v² = v0² + 2ax. Choose the equation that omits the quantity you neither know nor need.", "Free fall is constant-acceleration motion with a = −g = −9.80 m/s² (upward positive) at every instant, including the highest point where v = 0. A throw upward is symmetric: t up = v0/g, H = v0²/(2g), and the object returns to its launch height with v = −v0.", "A projectile's horizontal motion (constant vx = v0 cosθ) and vertical motion (free fall with v0y = v0 sinθ) are independent and linked only by time. On level ground: T = 2v0 sinθ/g, H = v0² sin²θ/(2g), R = v0² sin 2θ/g (maximum at 45°). For other landing heights, solve the vertical equation for t first."], "problems": [{"id": "A1", "topic": "Displacement, Velocity, and Speed", "text": "A car drives 300 m east and then 120 m west, taking 40.0 s in all. Find (a) the distance traveled, (b) the displacement, (c) the average speed, and (d) the average velocity.", "answer": "(a) 420 m (b) 180 m east (c) 10.5 m/s (d) 4.5 m/s east"}, {"id": "A2", "topic": "Displacement, Velocity, and Speed", "text": "A student walks 6.0 m north and then 8.0 m east. Find the distance traveled and the magnitude and direction of the displacement.", "answer": "distance 14.0 m; displacement 10.0 m at 36.9° north of east"}, {"id": "A3", "topic": "Displacement, Velocity, and Speed", "text": "A particle is at x = +5.0 m when t = 2.0 s and at x = −7.0 m when t = 8.0 s. Find its average velocity over this interval.", "answer": "−2.0 m/s"}, {"id": "A4", "topic": "Displacement, Velocity, and Speed", "text": "A bus completes a 120 km round trip in 3.0 h. Find its average speed and its average velocity.", "answer": "average speed 40 km/h; average velocity 0"}, {"id": "A5", "topic": "Displacement, Velocity, and Speed", "text": "Give an example of a motion in which the instantaneous velocity is never equal to the average velocity over some interval, and a motion in which the two are always equal.", "answer": ""}, {"id": "B1", "topic": "Graphs of Motion", "text": "An object's velocity rises uniformly from 0 to 12 m/s in 4.0 s, stays constant for 6.0 s, then falls uniformly to zero in a further 5.0 s. Sketch the v–t graph and find (a) the acceleration in each interval and (b) the total displacement.", "answer": "(a) +3.0 m/s², 0, −2.4 m/s² (b) 126 m"}, {"id": "B2", "topic": "Graphs of Motion", "text": "A position–time graph is a straight line passing through (t = 0, x = 2.0 m) and (t = 5.0 s, x = 17.0 m). What is the velocity, and what does the straightness of the line tell you about the acceleration?", "answer": "+3.0 m/s; a straight x–t line means the velocity is constant, so a = 0"}, {"id": "B3", "topic": "Graphs of Motion", "text": "An object's velocity changes uniformly from +8.0 m/s to −4.0 m/s over 6.0 s. Sketch the v–t graph and find (a) the acceleration, (b) the time at which the object reverses direction, (c) the distance traveled, and (d) the displacement.", "answer": "(a) −2.0 m/s² (b) 4.0 s (c) 20 m (d) +12 m"}, {"id": "C1", "topic": "Equations of Motion", "text": "A car accelerates uniformly from 12 m/s to 30 m/s in 6.0 s. Find its acceleration and the distance covered.", "answer": "3.0 m/s²; 126 m"}, {"id": "C2", "topic": "Equations of Motion", "text": "A motorcycle starts from rest with a constant acceleration of 2.5 m/s². Find its velocity and displacement after 8.0 s.", "answer": "20 m/s; 80 m"}, {"id": "C3", "topic": "Equations of Motion", "text": "A car traveling at 25 m/s brakes uniformly to rest in 50 m. Find the acceleration and the stopping time.", "answer": "−6.25 m/s²; 4.0 s"}, {"id": "C4", "topic": "Equations of Motion", "text": "A truck moving at 72 km/h accelerates at 1.2 m/s² for 15 s. Find its final speed and the distance traveled during the 15 s.", "answer": "38 m/s; 435 m"}, {"id": "C5", "topic": "Equations of Motion", "text": "A driver traveling at 20 m/s sees an obstacle. Her reaction time is 0.80 s, after which the car decelerates at 5.0 m/s². Find the total stopping distance (reaction distance plus braking distance).", "answer": "16 m + 40 m = 56 m"}, {"id": "D1", "topic": "Free Fall", "text": "A stone is dropped from a 45 m cliff. Find the time to reach the ground and the speed on impact.", "answer": "3.03 s; 29.7 m/s"}, {"id": "D2", "topic": "Free Fall", "text": "A ball is thrown downward at 5.0 m/s from a 30 m building. Find the time to reach the ground and the impact speed.", "answer": "2.02 s; 24.8 m/s"}, {"id": "D3", "topic": "Free Fall", "text": "A ball is thrown vertically upward at 15 m/s. Find (a) the maximum height, (b) the time to reach it, (c) the total time in the air before returning to the launch height, and (d) the velocity on return.", "answer": "(a) 11.5 m (b) 1.53 s (c) 3.06 s (d) −15 m/s"}, {"id": "D4", "topic": "Free Fall", "text": "A ball is thrown upward at 12 m/s from the edge of a 25 m cliff and lands at the base. Find the total time in the air and the impact speed.", "answer": "3.79 s; 25.2 m/s"}, {"id": "D5", "topic": "Free Fall", "text": "On Mars, g = 3.71 m/s². A ball thrown upward at 10 m/s reaches what maximum height, and how long does it take to get there? Compare with the same throw on Earth.", "answer": "13.5 m in 2.70 s (on Earth: 5.10 m in 1.02 s)"}, {"id": "E1", "topic": "Projectile Motion", "text": "A ball is kicked at 25 m/s at 40° above level ground. Find (a) the components of the initial velocity, (b) the time of flight, (c) the maximum height, and (d) the range.", "answer": "(a) 19.2 m/s, 16.1 m/s (b) 3.28 s (c) 13.2 m (d) 62.8 m"}, {"id": "E2", "topic": "Projectile Motion", "text": "A stone is thrown horizontally at 15 m/s from a 20 m cliff. Find (a) the time to reach the ground, (b) the horizontal distance from the cliff base to the landing point, and (c) the speed on impact.", "answer": "(a) 2.02 s (b) 30.3 m (c) 24.8 m/s"}, {"id": "E3", "topic": "Projectile Motion", "text": "A projectile is launched with initial velocity components v0x = v0y = 141.4 m/s. Find (a) the launch speed and angle, (b) the time to reach the highest point, (c) the maximum height, and (d) the range. (e) Explain why the projectile keeps moving after it reaches its highest point.", "answer": "(a) 200 m/s at 45° (b) 14.4 s (c) 1.02 × 10³ m (d) 4.08 × 10³ m (e) its horizontal velocity is unchanged by gravity"}, {"id": "E4", "topic": "Projectile Motion", "text": "What launch speed is needed to give a range of 50 m on level ground at a launch angle of 30°?", "answer": "23.8 m/s"}, {"id": "E5", "topic": "Projectile Motion", "text": "A ball is thrown at 18 m/s at 35° above the horizontal from a 12 m roof. Find (a) the time of flight, (b) the horizontal distance traveled, and (c) the maximum height above the ground.", "answer": "(a) 2.94 s (b) 43.3 m (c) 17.4 m Conceptual Review"}], "mc": [{"id": "MC1", "topic": "Conceptual Review", "text": "At the highest point of its flight, a ball thrown straight up has (a) zero velocity and zero acceleration (b) zero velocity and upward acceleration (c) zero velocity and downward acceleration of 9.80 m/s² (d) downward velocity and zero acceleration", "answer": "(c)"}, {"id": "MC2", "topic": "Conceptual Review", "text": "Which of the following can be zero for a moving object over some time interval? (a) average velocity (b) average speed (c) distance traveled
