  <h3>${t("beyondT")}</h3><p class="muted">${t("beyondB")}</p><table><tr><th style="width:32%">${t("topic")}</th><th>${t("whereRead")}</th></tr>${READ.beyond.map(([x,refs])=>`<tr><td class="ltr">${esc(x)}</td><td class="ltr">${refs.map(r=>`<b>${bookName(r[0])}</b> ${r[1]} <span class="muted">${esc(r[2])}</span>`).join("<br>")}</td></tr>`).join("")}</table>`;
}

/* ---------------- UPLOADS ---------------- */
function uploads(p){
  $("#title").textContent=t("nav_uploads");$("#crumb").textContent="";
  p.innerHTML=`<p class="lede">${t("upLede")}</p>
  <div class="drop" id="drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');addFiles(event.dataTransfer.files)">
    ${t("dropA")} <label style="color:var(--teal);cursor:pointer;text-decoration:underline">${t("dropB")}<input type="file" multiple accept=".pdf,.txt,.md,image/*" hidden onchange="addFiles(this.files)"></label><div class="muted" style="margin-top:6px">${t("dropC")}</div></div>
  <div id="files" style="margin-top:18px"></div>`;renderFiles();
}
function renderFiles(){
  const box=$("#files");if(!box)return;
  if(!state.uploads.length){box.innerHTML="";return}
  box.innerHTML=state.uploads.map((u,i)=>`<div class="card" style="margin-bottom:12px"><div class="fileitem" style="border:0;padding:0 0 10px">${u.img?`<img class="thumb" src="${u.img}" alt="">`:`<div class="thumb" style="display:grid;place-items:center;font-size:11px;color:var(--slate)">${esc(u.kind)}</div>`}<div style="flex:1"><b>${esc(u.name)}</b><div class="muted">${u.status}</div></div><button class="btn small" onclick="state.uploads.splice(${i},1);renderFiles()">${t("remove")}</button></div>
    ${u.text?`<div class="excerpt ltr">${esc(u.text.slice(0,1200))}${u.text.length>1200?"…":""}</div>`:""}
    ${u.matches?`<h4>${t("matching")}</h4>${u.matches.map(({it})=>resultCard(it,u.keyq)).join("")||`<div class="muted">${t("noStrong")}</div>`}`:""}
    ${(u.text||u.img)?`<div class="row" style="margin-top:12px"><select id="um${i}" style="width:auto;padding:5px 8px;font-size:13px"><option value="explain">${t("u_explain")}</option><option value="summ">${t("u_summ")}</option><option value="solve">${t("u_solve")}</option><option value="quiz">${t("u_quiz")}</option></select>${langSelect("ul"+i)}<button class="btn teal" onclick="explainUpload(${i},this)">${t("askTutor")}</button>${creditLine()}</div><div id="uo${i}"></div>`:""}
  </div>`).join("");
}
async function addFiles(files){
  for(const f of files){
    const u={name:f.name,kind:f.type.includes("pdf")?"PDF":f.type.startsWith("image")?"IMG":"TXT",status:t("readingFile")};state.uploads.unshift(u);renderFiles();
    try{
      if(u.kind==="TXT"){u.text=await f.text()}
      else if(u.kind==="IMG"){u.img=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});u.status=t("imgReady")}
      else{u.text=await pdfText(f)}
      if(u.text){const kw=keywords(u.text);u.keyq=kw.join(" ");u.matches=search(u.keyq,12).filter(r=>!(r.it.ch&&locked(r.it.ch))).slice(0,6);u.status=t("extracted",u.text.length.toLocaleString(),kw.slice(0,8).join(", "))}
    }catch(e){u.status=t("fileFail",e.message)}
    renderFiles();
  }
}
async function pdfText(f){
  if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=()=>rej(new Error("pdf.js unavailable"));document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
  const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let x="";
  for(let i=1;i<=Math.min(pdf.numPages,40);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();x+=c.items.map(y=>y.str).join(" ")+"\n\n"}
  return x.trim()||t("noTextLayer");
}
const STOP=new Set("the a an and or of to in is are for with that this from by on at as be it its which what find how when use using given each between into then than can will each two one m/s kg في من على إلى عن أن هذا هذه التي الذي مع".split(" "));
function keywords(text){const cnt={};for(const w of tok(text)){if(STOP.has(w)||w.length<3||/^\d/.test(w))continue;cnt[w]=(cnt[w]||0)+1}
  const vocab=new Set(INDEX.flatMap(i=>i.tt));return Object.entries(cnt).sort((a,b)=>(b[1]*(vocab.has(b[0])?3:1))-(a[1]*(vocab.has(a[0])?3:1))).slice(0,12).map(x=>x[0])}
async function explainUpload(i,btn){
  const u=state.uploads[i];const out=document.getElementById("uo"+i);const mode=document.getElementById("um"+i).value;const lang=document.getElementById("ul"+i).value;state.ansLang=lang;
  if(!canAsk()){out.innerHTML=paywallHTML();return}
  const ctx=(u.matches||[]).map(({it},k)=>`[${k+1}] (${it.type} · Chapter ${it.ch} · ${it.title})\n${it.text.slice(0,1200)}`).join("\n\n");
  const task={explain:"Explain the uploaded material as the course would, connecting each idea to the matching section or example.",summ:"Turn the uploaded material into concise revision notes: definitions, formulas, and the two or three pitfalls a student should watch for.",solve:"Identify the problem in the uploaded material and solve it step by step in the book's style (Known/Unknown, equation choice, substitution with units, boxed answer, check).",quiz:"Write three practice questions on the uploaded material in the style of the course practice sets, with short answers at the end."}[mode];
  const sys=`You are the physics tutor for this introductory mechanics course, working from the course text by ${AUTHOR}. ${task} Use the book's notation and g = 9.80 m/s². Cite matching passages as [n]. If the material is outside Chapters 1–4 (Measurement & Vectors, Kinematics, Newton's Laws, Work & Energy), say so and give only a brief orientation. Under 400 words; simple Markdown; equations in Unicode. ${langInstr(lang)}`;
  out.innerHTML=`<div class="muted" style="padding:10px 0"><span class="spin"></span> ${t("working")}</div>`;btn.disabled=true;
  try{
    const extra=u.img?[{type:"image",source:{type:"base64",media_type:u.img.slice(5,u.img.indexOf(";")),data:u.img.split(",")[1]}}]:null;
    const text=await callClaude(sys,`Uploaded material${u.text?":\n"+u.text.slice(0,6000):" is the attached image."}\n\nMatching course passages:\n${ctx||"(none)"}`,extra);
    useCredit();
    out.innerHTML=`<div class="ai ${lang==="ar"?"rtl":""}" style="margin-top:10px">${md(text)}</div>${canAsk()?"":paywallHTML()}`;
  }catch(e){out.innerHTML=`<div class="note">${t("aiFail",esc(e.message))}</div>`}
  btn.disabled=false;
}

/* ---------------- PROGRESS ---------------- */
function progress(p){
  $("#title").textContent=t("nav_progress");$("#crumb").textContent="";
  p.innerHTML=`<p class="lede">${t("progLede")}</p>
  <div class="grid c2">${CONTENT.map(c=>{const r=c.sections.filter(s=>state.read[s.num]).length,q=[...c.problems,...c.mc].filter(x=>state.done[c.num+"-"+x.id]).length,nq=c.problems.length+c.mc.length;return `<div class="card"><b style="font-family:var(--serif)">${t("chapter")} ${c.num} — ${esc(chShort(c))}</b><div class="muted" style="margin:8px 0 4px">${t("secRead")}: ${r}/${c.sections.length}</div><div class="bar"><i style="width:${100*r/c.sections.length}%"></i></div><div class="muted" style="margin:10px 0 4px">${t("probChecked")}: ${q}/${nq}</div><div class="bar"><i style="width:${100*q/nq}%;background:var(--amber)"></i></div></div>`}).join("")}</div>
  ${PAID_MODE?`<h3>${t("tutorUse")}</h3><div class="card">${state.unlocked?t("unlimited"):t("usedOf",state.used,FREE_ANSWERS)}</div>`:""}
  <h3>${t("quizHist")}</h3>${state.quiz.length?`<table><tr><th>${t("when")}</th><th>${t("scope")}</th><th>${t("score")}</th></tr>${state.quiz.slice().reverse().map(z=>`<tr><td class="ltr">${z.when.replace("T"," ")}</td><td>${z.ch==="all"?t("allChapters"):t("chapter")+" "+z.ch}</td><td>${z.score} / ${z.n}</td></tr>`).join("")}</table>`:`<div class="empty">${t("noQuiz")} <a href="#" onclick="event.preventDefault();go('bank','quiz')">${t("takeOne")}</a></div>`}
  <div class="row" style="margin-top:22px"><button class="btn" onclick="exportJSON()">${t("export")}</button><label class="btn" style="cursor:pointer">${t("import")}<input type="file" accept=".json" hidden onchange="importJSON(this.files[0])"></label><button class="btn" onclick="if(confirm(t('clearConfirm'))){state.read={};state.done={};state.work={};state.quiz=[];render()}">${t("clear")}</button></div>`;
}
function exportJSON(){const b=new Blob([JSON.stringify({read:state.read,done:state.done,work:state.work,quiz:state.quiz,used:state.used,unlocked:state.unlocked,lang:state.lang,payRef:state.payRef,exported:new Date().toISOString()},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="physics-progress.json";a.click();toast(t("exported"))}
async function importJSON(f){try{const d=JSON.parse(await f.text());Object.assign(state,{read:d.read||{},done:d.done||{},work:d.work||{},quiz:d.quiz||[],used:d.used||0,unlocked:!!d.unlocked,payRef:d.payRef||state.payRef});if(d.lang)setLang(d.lang);else render();toast(t("imported"))}catch{toast(t("badImport"))}}

  ${PAID_MODE?`<div class="card" style="max-width:640px;margin-top:14px"><b>${t("tutorAccess")}</b><p class="muted" style="margin:6px 0 10px">${state.unlocked?t("lk_all"):t("lk_status",FREE_CHAPTERS.join(", "),state.used,FREE_ANSWERS)}</p>${state.unlocked?"":paywallHTML(true)}</div>`:""}
  <div class="card" style="max-width:640px;margin-top:14px"><b>${t("aiConn")}</b><p class="muted" style="margin:6px 0 12px">${t("aiConnNote")}</p>
  <input type="password" id="key" placeholder="sk-ant-…" value="${esc(state.apiKey)}" class="ltr"><div class="row" style="margin-top:10px"><button class="btn primary" onclick="state.apiKey=document.getElementById('key').value.trim();checkAI();toast(t('saved'))">${t("save")}</button><button class="btn" onclick="checkAI(true)">${t("testConn")}</button></div></div>
  <div class="card" style="max-width:640px;margin-top:14px"><b>${t("about")}</b><p class="muted" style="margin:6px 0 0">${t("byAuthor",AUTHOR)} ${t("arCoverage",arCoverage())} ${t("aboutB",CONTENT.reduce((a,c)=>a+c.sections.length,0),CONTENT.reduce((a,c)=>a+c.examples.length,0),CONTENT.reduce((a,c)=>a+c.problems.length+c.mc.length,0),FORMULAS.length,FIGS.length)}</p></div>`;
}
function arCoverage(){let n=0,d=0;for(const c of CONTENT){for(const s of c.sections){d++;if((AR.paragraphs||{})[s.num])n++}for(const e of c.examples){d++;if((AR.examples||{})[e.id])n++}for(const q of c.problems.concat(c.mc)){d++;if((AR.problems||{})[c.num+"-"+q.id])n++}}return Math.round(100*n/d)}
function aiPill(){const pill=$("#aipill");if(state.aiOK===null){pill.textContent=t("aiChecking");pill.className="pill"}else if(state.aiOK){pill.textContent=t("aiOn");pill.className="pill ok"}else{pill.textContent=t("aiOff");pill.className="pill"}}
async function checkAI(verbose){
  state.aiOK=null;aiPill();
  try{await callClaude("Reply with the single word OK.","ping");state.aiOK=true;if(verbose)toast(t("connected"))}
  catch(e){state.aiOK=false;if(verbose)toast(t("notConnected")+e.message)}
  aiPill();
}

setLang("en");checkAI();loadKatex();
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();go("ask",state.view==="ask"?state.arg:"");setTimeout(()=>document.querySelector(".askbox input")?.focus(),0)}});
